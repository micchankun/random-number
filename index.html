<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ランダム4桁数字｜範囲指定でランダム表示</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{background:#111827;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;display:flex;justify-content:center;align-items:center;overflow:hidden}.container{width:min(1100px,100%);height:100dvh;padding:clamp(5px,1.5vw,20px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(3px,.7vh,10px);overflow:hidden}.site-description{width:100%;max-width:900px;color:#9ca3af;margin:0}.site-description h1{margin:0 0 3px;font-size:clamp(14px,min(2.5vw,3vh),24px);color:#d1d5db}.site-description p{margin:0;font-size:clamp(10px,min(1.5vw,1.8vh),15px);line-height:1.35}#number{font-family:"Courier New",monospace;font-size:clamp(48px,min(18vw,24vh),180px);font-weight:800;line-height:.95;letter-spacing:.05em;margin:2px 0;color:#fff;text-shadow:0 0 8px rgba(255,255,255,.1),0 0 18px rgba(59,130,246,.12);user-select:none;flex-shrink:1}#position{font-size:clamp(11px,min(1.8vw,2vh),18px);font-weight:600;color:#d1d5db}.range-controls{width:min(620px,100%);display:flex;align-items:center;justify-content:center;gap:clamp(4px,.8vw,10px);flex-shrink:0}.range-label{font-size:clamp(10px,min(1.4vw,1.7vh),14px);color:#9ca3af;font-weight:600;white-space:nowrap}.range-input{width:clamp(72px,10vw,110px);height:clamp(32px,5vh,42px);border:1px solid #4b5563;border-radius:8px;background:#f3f4f6;color:#111827;text-align:center;font-family:"Courier New",monospace;font-size:clamp(14px,2vw,18px);font-weight:700;padding:4px;outline:none}.range-input:focus,.range-input.range-active{outline:2px solid #2563eb;outline-offset:1px;box-shadow:none}.range-button{height:clamp(32px,5vh,42px);padding:0 clamp(10px,1.5vw,18px);border:0;border-radius:8px;background:#4b5563;color:#fff;font-size:clamp(11px,1.5vw,15px);font-weight:700;cursor:pointer}.range-button:hover{filter:brightness(1.15)}#rangeInfo{font-size:clamp(9px,min(1.3vw,1.5vh),13px);color:#9ca3af}.range-error{color:#fca5a5!important}.previous-wrap{width:100%;min-height:0;flex:1;display:flex;overflow:hidden}#previousNumbers{width:100%;min-height:45px;height:100%;overflow-y:auto;overflow-x:hidden;padding:clamp(3px,.7vh,10px) 8px;color:#d1d5db;font-family:"Courier New",monospace;font-size:clamp(10px,min(1.4vw,1.7vh),15px);line-height:1.3;text-align:center}.previous-number{display:inline-block;margin:2px 7px;white-space:nowrap;color:#d1d5db}.buttons{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(4px,.8vh,10px);flex-shrink:0}.buttons button,.interval-controls button{border:0;border-radius:clamp(7px,1.2vh,14px);min-height:clamp(38px,7vh,72px);height:clamp(42px,8vh,76px);padding:clamp(3px,.7vh,10px) clamp(5px,1vw,14px);color:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:transform .08s,filter .15s,box-shadow .15s;box-shadow:0 5px 12px rgba(0,0,0,.25)}button:hover{filter:brightness(1.15)}button:active,button.active{transform:scale(.96);filter:brightness(.82)}.main-text{font-size:clamp(14px,min(2.2vw,2.5vh),22px);font-weight:700;line-height:1.1}.key-text{margin-top:clamp(2px,.4vh,5px);font-size:clamp(7px,min(1vw,1.2vh),11px);line-height:1.1;opacity:.9}#nextButton{background:#2563eb}#prevButton{background:#16a34a}#autoButton{background:#d97706;grid-column:1/-1}#autoButton.running{background:#0891b2}#firstButton{background:#7c3aed}#lastButton{background:#db2777}#resetButton{background:#dc2626;grid-column:1}.interval-controls{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr 1fr;gap:clamp(4px,.8vw,10px);position:relative}.interval-controls button{width:100%}.interval-arrow{background:#eee!important;color:#000!important;font-size:clamp(22px,4vh,40px);font-weight:700}.interval-display{position:relative;background:#eee!important;color:#000!important}.interval-display .main-text{color:#000!important}.interval-menu{display:none;position:absolute;left:20%;right:20%;bottom:calc(100% + 7px);max-height:min(45vh,420px);overflow-y:auto;padding:5px;background:#1f2937;border:1px solid #4b5563;border-radius:10px;box-shadow:0 8px 25px rgba(0,0,0,.4);z-index:20}.interval-menu.open{display:block}.interval-controls .interval-option{min-height:38px!important;height:auto!important;margin:2px 0;padding:6px!important;background:#374151!important;color:#f9fafb!important;text-shadow:none!important;font-size:clamp(13px,2vh,20px)!important;font-weight:600!important}.interval-controls .interval-option.selected{background:#2563eb!important;color:#fff!important}.interval-controls .interval-option:not(.selected){color:#f9fafb!important;-webkit-text-fill-color:#f9fafb!important}@media(max-width:600px){.container{padding:5px;gap:3px}.site-description{display:none}.range-controls{gap:4px}.range-label{font-size:10px}.range-input{width:68px}.range-button{padding:0 8px}.buttons{grid-template-columns:1fr}.interval-menu{left:5%;right:5%}.key-text{font-size:8px}}@media(max-height:700px){.range-controls{gap:4px}.range-input,.range-button{height:32px}.range-info{font-size:9px}}@media(max-height:600px){.container{gap:2px;padding-top:3px;padding-bottom:3px}.site-description{display:none}#number{font-size:clamp(38px,17vh,125px)}#previousNumbers{min-height:35px;font-size:10px}.buttons{gap:3px}.buttons button,.interval-controls button{min-height:32px;height:6.5vh;padding:2px 4px;border-radius:6px}.main-text{font-size:clamp(12px,2.5vh,17px)}.key-text{font-size:6px;margin-top:1px}.interval-arrow{font-size:clamp(18px,3.5vh,30px)}.interval-menu{max-height:38vh}}@media(max-height:450px){#number{font-size:clamp(34px,15vh,95px)}#previousNumbers{min-height:30px}.key-text{display:none}.buttons button,.interval-controls button{min-height:28px;height:6vh}.interval-option{min-height:30px!important}.range-label{font-size:9px}.range-input,.range-button{height:28px}.range-input{width:62px}.range-button{font-size:10px}}
</style>
</head>
<body>
<main class="container">
<div id="number">0000</div><section class="site-description"><h1>ランダム4桁数字表示</h1><p>0000〜9999の4桁数字を、設定した最小値〜最大値の範囲でランダムな順番に表示します。</p></section><div id="position">1 / 10000</div>
<div class="range-controls"><span class="range-label">最小</span><input id="minInput" class="range-input" type="text" inputmode="numeric" maxlength="4" value="0" aria-label="最小値"><span class="range-label">〜</span><span class="range-label">最大</span><input id="maxInput" class="range-input" type="text" inputmode="numeric" maxlength="4" value="9999" aria-label="最大値"><button id="rangeButton" class="range-button" type="button"><span class="main-text">数字範囲選択</span><span class="key-text">・ ? /</span></button></div>
<div id="rangeInfo">現在の範囲：0000 〜 9999</div><div id="status">自動表示停止中</div><div class="previous-wrap"><div id="previousNumbers"></div></div>
<div class="buttons"><button id="prevButton" type="button"><span class="main-text">前の数字</span><span class="key-text">バックスペース・左・下・A・S・J</span></button><button id="nextButton" type="button"><span class="main-text">次の数字</span><span class="key-text">エンター・右・上・L・D・W</span></button><button id="autoButton" type="button"><span class="main-text" id="autoMainText">自動表示開始</span><span class="key-text">スペース・K・Q</span></button>
<div class="interval-controls"><button id="intervalDecrease" class="interval-arrow" type="button">＜</button><button id="intervalButton" class="interval-display" type="button"><span class="main-text" id="intervalText">5秒</span></button><button id="intervalIncrease" class="interval-arrow" type="button">＞</button><div id="intervalMenu" class="interval-menu" role="listbox"></div></div>
<button id="firstButton" type="button"><span class="main-text">最初に戻る</span><span class="key-text">1キー</span></button><button id="lastButton" type="button"><span class="main-text">最後に進む</span><span class="key-text">9キー</span></button><button id="resetButton" type="button"><span class="main-text">リセット</span><span class="key-text">0キー</span></button></div>
</main>
<script>
const INTERVALS=[['0.1秒',100],['0.2秒',200],['0.3秒',300],['0.4秒',400],['0.5秒',500],['0.6秒',600],['0.7秒',700],['0.8秒',800],['0.9秒',900],['1秒',1000],['3秒',3000],['5秒',5000],['10秒',10000],['15秒',15000],['20秒',20000],['30秒',30000],['45秒',45000],['1分',60000],['1分30秒',90000],['2分',120000],['2分30秒',150000],['3分',180000],['3分30秒',210000],['4分',240000],['4分30秒',270000],['5分',300000]];
const $=id=>document.getElementById(id);const numberEl=$('number'),positionEl=$('position'),statusEl=$('status'),prevNums=$('previousNumbers'),nextBtn=$('nextButton'),prevBtn=$('prevButton'),autoBtn=$('autoButton'),autoText=$('autoMainText'),firstBtn=$('firstButton'),lastBtn=$('lastButton'),resetBtn=$('resetButton'),decBtn=$('intervalDecrease'),intBtn=$('intervalButton'),incBtn=$('intervalIncrease'),intText=$('intervalText'),menu=$('intervalMenu'),minInput=$('minInput'),maxInput=$('maxInput'),rangeButton=$('rangeButton'),rangeInfo=$('rangeInfo');
let minNumber=0,maxNumber=9999,numbers=[],currentIndex=0,autoRunning=false,autoTimer=null,intervalIndex=11,rangeMode=0,rangeBuffer='',rangeTyping=false;
function createRandomNumbers(){numbers=Array.from({length:maxNumber-minNumber+1},(_,i)=>i+minNumber);for(let i=numbers.length-1;i>0;i--){let r=Math.floor(Math.random()*(i+1));[numbers[i],numbers[r]]=[numbers[r],numbers[i]]}currentIndex=0}function fmt(n){return String(n).padStart(4,'0')}
function displayNumber(){numberEl.textContent=fmt(numbers[currentIndex]);positionEl.textContent=`${currentIndex+1} / ${numbers.length}`;if(!rangeMode)rangeInfo.textContent=`現在の範囲：${fmt(minNumber)} 〜 ${fmt(maxNumber)}`;prevNums.innerHTML='';for(let i=Math.max(0,currentIndex-50);i<currentIndex;i++){let s=document.createElement('span');s.className='previous-number';s.textContent=fmt(numbers[i]);prevNums.appendChild(s)}prevNums.scrollTop=prevNums.scrollHeight;statusEl.textContent=autoRunning?'自動表示中':'自動表示停止中';autoText.textContent=autoRunning?'自動表示停止':'自動表示開始';autoBtn.classList.toggle('running',autoRunning)}
function flash(b){b.classList.add('active');setTimeout(()=>b.classList.remove('active'),120)}function restartTimer(){if(!autoRunning)return;if(autoTimer)clearTimeout(autoTimer);autoTimer=setTimeout(autoNext,INTERVALS[intervalIndex][1])}
function nextNumber(){if(currentIndex<numbers.length-1)currentIndex++;else if(autoRunning){stopAuto();return}displayNumber();restartTimer()}function previousNumber(){if(currentIndex>0)currentIndex--;displayNumber();restartTimer()}function goFirst(){currentIndex=0;displayNumber();restartTimer()}function goLast(){currentIndex=numbers.length-1;displayNumber();if(autoRunning)stopAuto()}function autoNext(){if(!autoRunning)return;if(currentIndex>=numbers.length-1){stopAuto();return}currentIndex++;displayNumber();if(currentIndex<numbers.length-1)restartTimer();else stopAuto()}function startAuto(){if(autoRunning||currentIndex>=numbers.length-1)return;autoRunning=true;displayNumber();restartTimer()}function stopAuto(){autoRunning=false;if(autoTimer)clearTimeout(autoTimer);autoTimer=null;displayNumber()}function toggleAuto(){autoRunning?stopAuto():startAuto()}function resetNumbers(){createRandomNumbers();displayNumber();restartTimer()}
function applyRange(){let min=Number(minInput.value),max=Number(maxInput.value);if(!Number.isInteger(min)||!Number.isInteger(max)||min<0||max>9999||min>max){rangeInfo.textContent='最小値・最大値は 0000〜9999 の整数で、最小値≦最大値にしてください';rangeInfo.classList.add('range-error');return false}rangeInfo.classList.remove('range-error');minNumber=min;maxNumber=max;minInput.value=min;maxInput.value=max;if(autoRunning)stopAuto();createRandomNumbers();displayNumber();return true}
function updateInterval(){intText.textContent=INTERVALS[intervalIndex][0];[...menu.children].forEach((b,i)=>b.classList.toggle('selected',i===intervalIndex))}function setIntervalIndex(i){intervalIndex=Math.max(0,Math.min(INTERVALS.length-1,i));updateInterval();restartTimer()}INTERVALS.forEach((x,i)=>{let b=document.createElement('button');b.type='button';b.className='interval-option';b.textContent=x[0];b.onclick=e=>{e.stopPropagation();if(rangeMode)return;flash(b);setIntervalIndex(i);menu.classList.remove('open')};menu.appendChild(b)});updateInterval();
function setRangeInputFocus(mode){minInput.classList.toggle('range-active',mode===1);maxInput.classList.toggle('range-active',mode===2);if(mode===1)minInput.focus();if(mode===2)maxInput.focus()}
function cancelRangeMode(){rangeMode=0;rangeBuffer='';rangeTyping=false;minInput.readOnly=false;maxInput.readOnly=false;minInput.blur();maxInput.blur();setRangeInputFocus(0);statusEl.textContent=autoRunning?'自動表示中':'自動表示停止中'}
function startRangeMode(){if(autoRunning)stopAuto();rangeMode=1;rangeBuffer='';rangeTyping=false;minInput.value=minNumber;maxInput.value=maxNumber;minInput.readOnly=true;maxInput.readOnly=true;setRangeInputFocus(1);rangeInfo.textContent='最小値を入力 → Enterで決定';rangeInfo.classList.remove('range-error')}
function normalizeDigits(value){return String(value).replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0))}
function finishRangeInput(value,mode){let v=normalizeDigits(value).replace(/\D/g,'');if(v==='')return false;let n=Number(v);if(!Number.isInteger(n)||n<0||n>9999){rangeInfo.textContent='0000〜9999で入力してください';rangeInfo.classList.add('range-error');return false}if(mode===1){minInput.value=n;rangeMode=2;rangeBuffer='';rangeTyping=false;setRangeInputFocus(2);rangeInfo.textContent='最大値を入力 → Enterで決定';return true}maxInput.value=n;if(!applyRange())return false;cancelRangeMode();return true}
function handleRangeKey(e){if(!rangeMode)return false;let digit=normalizeDigits(e.key);if(e.key==='/'||e.key==='?'||e.key==='？'||e.key==='・'||e.code==='Slash'){e.preventDefault();e.stopPropagation();return true}if(/^[0-9]$/.test(digit)){e.preventDefault();e.stopPropagation();let input=rangeMode===1?minInput:maxInput;if(!rangeTyping){rangeBuffer='';rangeTyping=true;input.value=''}if(rangeBuffer.length<4){rangeBuffer+=digit;input.value=rangeBuffer}return true}if(e.key==='Backspace'){e.preventDefault();e.stopPropagation();let input=rangeMode===1?minInput:maxInput;if(rangeTyping){rangeBuffer=rangeBuffer.slice(0,-1);input.value=rangeBuffer;if(rangeBuffer==='')rangeTyping=false}return true}if(e.key==='Enter'){e.preventDefault();e.stopPropagation();let input=rangeMode===1?minInput:maxInput;let value=rangeTyping?rangeBuffer:input.value;finishRangeInput(value,rangeMode);return true}if(e.key==='Escape'){e.preventDefault();e.stopPropagation();cancelRangeMode();return true}e.preventDefault();e.stopPropagation();return true}
[minInput,maxInput].forEach(input=>input.addEventListener('input',()=>{if(!rangeMode||input.readOnly)return;let v=normalizeDigits(input.value).replace(/\D/g,'').slice(0,4);input.value=v;rangeBuffer=v;rangeTyping=true}));
nextBtn.onclick=()=>{if(rangeMode)return;flash(nextBtn);nextNumber()};prevBtn.onclick=()=>{if(rangeMode)return;flash(prevBtn);previousNumber()};autoBtn.onclick=()=>{if(rangeMode)return;flash(autoBtn);toggleAuto()};firstBtn.onclick=()=>{if(rangeMode)return;flash(firstBtn);goFirst()};lastBtn.onclick=()=>{if(rangeMode)return;flash(lastBtn);goLast()};resetBtn.onclick=()=>{if(rangeMode)return;flash(resetBtn);resetNumbers()};rangeButton.onclick=()=>{if(rangeMode)return;flash(rangeButton);startRangeMode()};decBtn.onclick=()=>{if(rangeMode)return;flash(decBtn);setIntervalIndex(intervalIndex-1)};incBtn.onclick=()=>{if(rangeMode)return;flash(incBtn);setIntervalIndex(intervalIndex+1)};intBtn.onclick=e=>{e.stopPropagation();if(rangeMode)return;flash(intBtn);menu.classList.toggle('open')};document.addEventListener('click',e=>{if(!e.target.closest('.interval-controls'))menu.classList.remove('open')});
document.addEventListener('keydown',e=>{if(handleRangeKey(e))return;if(e.target.matches('input'))return;let k=e.key;if(k==='/'||k==='?'||k==='？'||k==='・'||e.code==='Slash'){e.preventDefault();flash(rangeButton);startRangeMode();return}if(k==='Enter'||k==='ArrowRight'||k==='ArrowUp'||/^[lLdDwW]$/.test(k)){e.preventDefault();flash(nextBtn);nextNumber();return}if(k==='Backspace'||k==='ArrowLeft'||k==='ArrowDown'||/^[aAsSjJ]$/.test(k)){e.preventDefault();flash(prevBtn);previousNumber();return}if(k===' '||/^[kKqQ]$/.test(k)){e.preventDefault();flash(autoBtn);toggleAuto();return}if(k==='1'){e.preventDefault();flash(firstBtn);goFirst();return}if(k==='9'){e.preventDefault();flash(lastBtn);goLast();return}if(k==='0'){e.preventDefault();flash(resetBtn);resetNumbers();return}if(k==='<'||k==='＜'||e.code==='Comma'){e.preventDefault();flash(decBtn);setIntervalIndex(intervalIndex-1);return}if(k==='>'||k==='＞'||e.code==='Period'){e.preventDefault();flash(incBtn);setIntervalIndex(intervalIndex+1);return}});
rangeButton.title='数字範囲選択を開始';createRandomNumbers();displayNumber();
</script>
</body>
</html>
