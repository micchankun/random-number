<body>
<main class="container">
<div id="number">0000</div><section class="site-description"><h1>ランダム4桁数字表示</h1><p>0000〜9999の4桁数字を、設定した最小値〜最大値の範囲でランダムな順番に表示します。</p></section><div id="position">1 / 10000</div>
<div class="range-controls"><span class="range-label">最小</span><input id="minInput" class="range-input" type="text" inputmode="numeric" maxlength="4" value="0" aria-label="最小値"><span class="range-label">〜</span><span class="range-label">最大</span><input id="maxInput" class="range-input" type="text" inputmode="numeric" maxlength="4" value="9999" aria-label="最大値"><button id="rangeButton" class="range-button" type="button"><span class="main-text">数字範囲選択</span><span class="key-text">・ ? /</span></button></div>
<div id="rangeInfo">現在の範囲：0000 〜 9999</div><div id="status">自動表示停止中</div>
<div class="previous-wrap"><div class="history-panel"><div class="history-header" id="historyToggle" role="button" tabindex="0" aria-expanded="true"><span>履歴 <span class="history-count" id="historyCount">0件</span></span><span class="history-toggle" id="historyArrow">▾</span></div><div id="previousNumbers"></div></div></div>
<div class="buttons"><button id="prevButton" type="button"><span class="main-text">前の数字</span><span class="key-text">バックスペース・左・下・A・S・J</span></button><button id="nextButton" type="button"><span class="main-text">次の数字</span><span class="key-text">エンター・右・上・L・D・W</span></button><button id="autoButton" type="button"><span class="main-text" id="autoMainText">自動表示開始</span><span class="key-text">スペース・K・Q</span></button>
<div class="interval-controls"><button id="intervalDecrease" class="interval-arrow" type="button">＜</button><button id="intervalButton" class="interval-display" type="button"><span class="main-text" id="intervalText">3秒</span></button><button id="intervalIncrease" class="interval-arrow" type="button">＞</button><div id="intervalMenu" class="interval-menu" role="listbox"></div></div>
<button id="firstButton" type="button"><span class="main-text">最初に戻る</span><span class="key-text">1キー</span></button><button id="lastButton" type="button"><span class="main-text">最後に進む</span><span class="key-text">9キー</span></button><button id="resetButton" type="button"><span class="main-text">リセット</span><span class="key-text">0キー</span></button><div class="voice-controls"><button id="voiceToggle" class="voice-toggle" type="button">🔇 音声読み上げ：OFF</button><select id="voiceSelect" class="voice-select" aria-label="読み上げ音声"></select></div></div>
</main>
<script>
const INTERVALS=[['0.1秒',100],['0.2秒',200],['0.3秒',300],['0.4秒',400],['0.5秒',500],['0.6秒',600],['0.7秒',700],['0.8秒',800],['0.9秒',900],['1秒',1000],['1.1秒',1100],['1.2秒',1200],['1.3秒',1300],['1.4秒',1400],['1.5秒',1500],['1.6秒',1600],['1.7秒',1700],['1.8秒',1800],['1.9秒',1900],['2秒',2000],['2.1秒',2100],['2.2秒',2200],['2.3秒',2300],['2.4秒',2400],['2.5秒',2500],['2.6秒',2600],['2.7秒',2700],['2.8秒',2800],['2.9秒',2900],['3秒',3000],['5秒',5000],['10秒',10000],['15秒',15000],['20秒',20000],['30秒',30000],['45秒',45000],['1分',60000],['1分30秒',90000],['2分',120000],['2分30秒',150000],['3分',180000],['3分30秒',210000],['4分',240000],['4分30秒',270000],['5分',300000]];
const $=id=>document.getElementById(id);const numberEl=$('number'),positionEl=$('position'),statusEl=$('status'),prevNums=$('previousNumbers'),nextBtn=$('nextButton'),prevBtn=$('prevButton'),autoBtn=$('autoButton'),autoText=$('autoMainText'),firstBtn=$('firstButton'),lastBtn=$('lastButton'),resetBtn=$('resetButton'),decBtn=$('intervalDecrease'),intBtn=$('intervalButton'),incBtn=$('intervalIncrease'),intText=$('intervalText'),menu=$('intervalMenu'),minInput=$('minInput'),maxInput=$('maxInput'),rangeButton=$('rangeButton'),rangeInfo=$('rangeInfo'),voiceToggle=$('voiceToggle'),voiceSelect=$('voiceSelect'),historyPanel=document.querySelector('.history-panel'),historyToggle=$('historyToggle'),historyArrow=$('historyArrow'),historyCount=$('historyCount');
let minNumber=0,maxNumber=9999,numbers=[],currentIndex=0,autoRunning=false,autoTimer=null,intervalIndex=29,rangeMode=0,rangeBuffer='',rangeTyping=false,voiceEnabled=false,selectedVoice=null,availableVoices=[],pendingRangeApply=false;

function speakNumber(){if(!voiceEnabled||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let text=fmt(numbers[currentIndex]).split('').join(' ');let u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';if(selectedVoice)u.voice=selectedVoice;u.rate=1;u.pitch=1;window.speechSynthesis.speak(u)}
function loadVoices(){if(!('speechSynthesis'in window)){voiceSelect.disabled=true;voiceToggle.disabled=true;voiceToggle.textContent='🔇 音声非対応';return}availableVoices=window.speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('ja'));voiceSelect.innerHTML='';if(!availableVoices.length){let o=document.createElement('option');o.value='';o.textContent='標準音声（ブラウザ）';voiceSelect.appendChild(o);voiceSelect.disabled=true;return}voiceSelect.disabled=false;availableVoices.forEach((v,i)=>{let o=document.createElement('option');o.value=String(i);o.textContent=v.name+'（'+v.lang+'）';voiceSelect.appendChild(o)});let saved=localStorage.getItem('randomNumberVoice');let idx=availableVoices.findIndex(v=>v.voiceURI===saved);if(idx<0)idx=0;voiceSelect.value=String(idx);selectedVoice=availableVoices[idx]}
function setVoiceEnabled(enabled){voiceEnabled=enabled;voiceToggle.textContent=enabled?'🔊 音声読み上げ：ON':'🔇 音声読み上げ：OFF';voiceToggle.classList.toggle('on',enabled);if(!enabled&&'speechSynthesis'in window)window.speechSynthesis.cancel()}
function cycleVoice(){if(!availableVoices.length||voiceSelect.disabled)return;let i=availableVoices.findIndex(v=>v.voiceURI===selectedVoice?.voiceURI);i=(i+1)%availableVoices.length;selectedVoice=availableVoices[i];voiceSelect.value=String(i);localStorage.setItem('randomNumberVoice',selectedVoice.voiceURI);if(voiceEnabled)speakNumber()}
function displayNumber(){numberEl.textContent=fmt(numbers[currentIndex]);positionEl.textContent=`${currentIndex+1} / ${numbers.length}`;if(!rangeMode)rangeInfo.textContent=`現在の範囲：${fmt(minNumber)} 〜 ${fmt(maxNumber)}`;prevNums.innerHTML='';for(let i=0;i<currentIndex;i++){let s=document.createElement('span');s.className='previous-number';s.textContent=fmt(numbers[i]);prevNums.appendChild(s)}prevNums.scrollTop=prevNums.scrollHeight;if(historyCount)historyCount.textContent=`${currentIndex}件`;statusEl.textContent=autoRunning?'自動表示中':'自動表示停止中';autoText.textContent=autoRunning?'自動表示停止':'自動表示開始';autoBtn.classList.toggle('running',autoRunning);speakNumber()}
function flash(b){b.classList.add('active');setTimeout(()=>b.classList.remove('active'),120)}function restartTimer(){if(!autoRunning)return;if(autoTimer)clearTimeout(autoTimer);autoTimer=setTimeout(autoNext,INTERVALS[intervalIndex][1])}
function nextNumber(){if(currentIndex<numbers.length-1)currentIndex++;else if(autoRunning){stopAuto();return}displayNumber();restartTimer()}function previousNumber(){if(currentIndex>0)currentIndex--;displayNumber();restartTimer()}function goFirst(){currentIndex=0;displayNumber();restartTimer()}function goLast(){currentIndex=numbers.length-1;displayNumber();if(autoRunning)stopAuto()}function autoNext(){if(!autoRunning)return;if(currentIndex>=numbers.length-1){stopAuto();return}currentIndex++;displayNumber();if(currentIndex<numbers.length-1)restartTimer();else stopAuto()}function startAuto(){if(autoRunning||currentIndex>=numbers.length-1)return;autoRunning=true;displayNumber();restartTimer()}function stopAuto(){autoRunning=false;if(autoTimer)clearTimeout(autoTimer);autoTimer=null;displayNumber()}function toggleAuto(){autoRunning?stopAuto():startAuto()}function resetNumbers(){if(pendingRangeApply){pendingRangeApply=false;if(!applyRange()){pendingRangeApply=true;return}return}createRandomNumbers();displayNumber();restartTimer()}
function applyRange(){let min=Number(minInput.value),max=Number(maxInput.value);if(!Number.isInteger(min)||!Number.isInteger(max)||min<0||max>9999||min>max){rangeInfo.textContent='最小値・最大値は 0000〜9999 の整数で、最小値≦最大値にしてください';rangeInfo.classList.add('range-error');return false}rangeInfo.classList.remove('range-error');minNumber=min;maxNumber=max;minInput.value=min;maxInput.value=max;if(autoRunning)stopAuto();createRandomNumbers();displayNumber();return true}
function updateInterval(){intText.textContent=INTERVALS[intervalIndex][0];[...menu.children].forEach((b,i)=>b.classList.toggle('selected',i===intervalIndex))}function setIntervalIndex(i){intervalIndex=Math.max(0,Math.min(INTERVALS.length-1,i));updateInterval();restartTimer()}INTERVALS.forEach((x,i)=>{let b=document.createElement('button');b.type='button';b.className='interval-option';b.textContent=x[0];b.onclick=e=>{e.stopPropagation();if(rangeMode)return;flash(b);setIntervalIndex(i);menu.classList.remove('open')};menu.appendChild(b)});updateInterval();
function setRangeInputFocus(mode){minInput.classList.toggle('range-active',mode===1);maxInput.classList.toggle('range-active',mode===2);if(mode===1)minInput.focus();if(mode===2)maxInput.focus()}
function cancelRangeMode(){rangeMode=0;rangeBuffer='';rangeTyping=false;minInput.readOnly=false;maxInput.readOnly=false;minInput.blur();maxInput.blur();setRangeInputFocus(0);statusEl.textContent=autoRunning?'自動表示中':'自動表示停止中'}
function startRangeMode(){if(autoRunning)stopAuto();rangeMode=1;rangeBuffer='';rangeTyping=false;pendingRangeApply=false;minInput.value=minNumber;maxInput.value=maxNumber;minInput.readOnly=true;maxInput.readOnly=true;setRangeInputFocus(1);rangeInfo.textContent='最小値を入力 → Enterで決定';rangeInfo.classList.remove('range-error')}
function normalizeDigits(value){return String(value).replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0))}
function finishRangeInput(value,mode){let v=normalizeDigits(value).replace(/\D/g,'');if(v==='')return false;let n=Number(v);if(!Number.isInteger(n)||n<0||n>9999){rangeInfo.textContent='0000〜9999で入力してください';rangeInfo.classList.add('range-error');return false}if(mode===1){minInput.value=n;rangeMode=2;rangeBuffer='';rangeTyping=false;setRangeInputFocus(2);rangeInfo.textContent='最大値を入力 → Enterで決定';return true}maxInput.value=n;pendingRangeApply=true;cancelRangeMode();rangeInfo.textContent=`範囲設定完了：${fmt(Number(minInput.value))} 〜 ${fmt(n)} ／ 0キーまたはリセットで適用`;rangeInfo.classList.remove('range-error');return true}
function handleRangeKey(e){if(!rangeMode)return false;let digit=normalizeDigits(e.key);if(e.key==='/'||e.key==='?'||e.key==='？'||e.key==='・'||e.code==='Slash'){e.preventDefault();e.stopPropagation();return true}if(/^[0-9]$/.test(digit)){e.preventDefault();e.stopPropagation();let input=rangeMode===1?minInput:maxInput;if(!rangeTyping){rangeBuffer='';rangeTyping=true;input.value=''}if(rangeBuffer.length<4){rangeBuffer+=digit;input.value=rangeBuffer}return true}if(e.key==='Backspace'){e.preventDefault();e.stopPropagation();let input=rangeMode===1?minInput:maxInput;if(rangeTyping){rangeBuffer=rangeBuffer.slice(0,-1);input.value=rangeBuffer;if(rangeBuffer==='')rangeTyping=false}return true}if(e.key==='Enter'){e.preventDefault();e.stopPropagation();let input=rangeMode===1?minInput:maxInput;let value=rangeTyping?rangeBuffer:input.value;finishRangeInput(value,rangeMode);return true}if(e.key==='Escape'){e.preventDefault();e.stopPropagation();cancelRangeMode();return true}e.preventDefault();e.stopPropagation();return true}

<!-- MOBILE_TABLET_RANGE_INPUT_FIX_V2 -->
<script>
(()=>{
  const mobileTablet=window.matchMedia('(max-width: 900px)');
  if(!mobileTablet.matches)return;
  const inputs=[minInput,maxInput].filter(Boolean);
  const focusForTouch=(input,mode)=>{
    if(rangeMode===0)startRangeMode();
    rangeMode=mode;
    rangeBuffer='';
    rangeTyping=false;
    minInput.readOnly=mode!==1;
    maxInput.readOnly=mode!==2;
    minInput.classList.toggle('range-active',mode===1);
    maxInput.classList.toggle('range-active',mode===2);
    rangeInfo.classList.remove('range-error');
    rangeInfo.textContent=mode===1?'最小値を入力 → Enterで決定':'最大値を入力 → Enterで決定';
    input.setAttribute('inputmode','numeric');
    input.focus({preventScroll:true});
    input.select();
  };
  rangeButton.addEventListener('pointerdown',e=>{
    e.stopImmediatePropagation();
    if(rangeMode!==0)return;
    flash(rangeButton);
    startRangeMode();
    minInput.readOnly=false;
    minInput.classList.add('range-active');
    minInput.focus({preventScroll:true});
    minInput.select();
  },true);
  inputs.forEach(input=>{
    input.addEventListener('pointerdown',e=>{
      e.stopImmediatePropagation();
      focusForTouch(input,input===minInput?1:2);
    },true);
    input.addEventListener('keydown',e=>{
      const digit=normalizeDigits(e.key);
      if(/^[0-9]$/.test(digit)){
        e.preventDefault();
        e.stopImmediatePropagation();
        const mode=input===minInput?1:2;
        if(rangeMode!==mode)focusForTouch(input,mode);
        if(!rangeTyping){rangeBuffer='';rangeTyping=true;input.value=''}
        if(rangeBuffer.length<4){rangeBuffer+=digit;input.value=rangeBuffer}
        return;
      }
      if(e.key==='Backspace'||e.key==='Delete'){
        e.preventDefault();
        e.stopImmediatePropagation();
        if(rangeMode!== (input===minInput?1:2))return;
        if(rangeTyping){rangeBuffer=rangeBuffer.slice(0,-1);input.value=rangeBuffer;if(rangeBuffer==='')rangeTyping=false}
        return;
      }
      if(e.key==='Enter'){
        e.preventDefault();
        e.stopImmediatePropagation();
        const mode=input===minInput?1:2;
        const value=rangeTyping?rangeBuffer:input.value;
        finishRangeInput(value,mode);
        return;
      }
    },true);
    input.addEventListener('beforeinput',e=>{
      if(e.inputType==='insertText'||e.inputType==='insertCompositionText'||e.inputType==='insertFromPaste'){
        const data=normalizeDigits(e.data??'').replace(/\D/g,'');
        e.preventDefault();
        e.stopImmediatePropagation();
        if(!data)return;
        if(rangeMode!==(input===minInput?1:2))focusForTouch(input,input===minInput?1:2);
        if(!rangeTyping){rangeBuffer='';rangeTyping=true;input.value=''}
        if(rangeBuffer.length<4){rangeBuffer=(rangeBuffer+data).slice(0,4);input.value=rangeBuffer}
        input.dispatchEvent(new Event('input',{bubbles:true}));
        return;
      }
    },true);
  });
  document.addEventListener('pointerdown',e=>{
    if(!rangeMode)return;
    if(e.target.closest('.range-controls,button,select'))return;
    const input=rangeMode===1?minInput:maxInput;
    const value=rangeTyping?rangeBuffer:input.value;
    finishRangeInput(value,rangeMode);
  },true);
})();
</script>
<!-- MOBILE_TABLET_DOUBLE_INPUT_GUARD -->
<script>
(()=>{
  const mq=window.matchMedia('(max-width: 600px)');
  if(!mq.matches)return;
  let handledDigit='';
  window.addEventListener('keydown',e=>{
    if(e.target!==minInput&&e.target!==maxInput)return;
    const digit=normalizeDigits(e.key);
    if(!/^[0-9]$/.test(digit))return;
    handledDigit=digit;
    setTimeout(()=>{handledDigit=''},150);
  },true);
  window.addEventListener('beforeinput',e=>{
    if(e.target!==minInput&&e.target!==maxInput)return;
    const data=normalizeDigits(e.data??'').replace(/\D/g,'');
    if(data&&data===handledDigit){e.preventDefault();e.stopImmediatePropagation();handledDigit='';}
  },true);
})();
</script>
<!-- MOBILE_KEYBOARD_LAUNCH_FIX_V1 -->
<script>
(()=>{
  const mobile=window.matchMedia('(max-width: 600px)');
  if(!mobile.matches)return;
  const isRangeTarget=t=>t===rangeButton||t===minInput||t===maxInput;
  window.addEventListener('pointerdown',e=>{
    const t=e.target;
    if(t!==rangeButton && t!==minInput && t!==maxInput)return;
    const input=t===rangeButton?minInput:t;
    setTimeout(()=>{
      if(t===rangeButton && rangeMode===0){
        startRangeMode();
        minInput.readOnly=false;
        minInput.classList.add('range-active');
      }
      input.readOnly=false;
      input.focus({preventScroll:true});
      try{input.select()}catch(_){}
    },0);
  },true);
  window.addEventListener('touchstart',e=>{
    const t=e.target;
    if(!isRangeTarget(t))return;
    const input=t===rangeButton?minInput:t;
    setTimeout(()=>{
      if(t===rangeButton && rangeMode===0){
        startRangeMode();
        minInput.readOnly=false;
        minInput.classList.add('range-active');
      }
      input.readOnly=false;
      input.focus({preventScroll:true});
      try{input.select()}catch(_){}
    },0);
  },{capture:true,passive:true});
})();
</script>

<!-- MOBILE_KEYBOARD_TOUCH_FIX_V2 -->
<script>
(()=>{
  const mobile=window.matchMedia('(max-width: 600px)');
  if(!mobile.matches)return;
  const focusInput=(input)=>{
    if(!input)return;
    const mode=input===minInput?1:2;
    if(rangeMode===0)startRangeMode();
    rangeMode=mode;
    rangeBuffer='';
    rangeTyping=false;
    minInput.readOnly=mode!==1;
    maxInput.readOnly=mode!==2;
    minInput.classList.toggle('range-active',mode===1);
    maxInput.classList.toggle('range-active',mode===2);
    rangeInfo.classList.remove('range-error');
    rangeInfo.textContent=mode===1?'最小値を入力 → Enterで決定':'最大値を入力 → Enterで決定';
    input.readOnly=false;
    input.setAttribute('inputmode','numeric');
    input.focus({preventScroll:true});
    try{input.setSelectionRange(input.value.length,input.value.length)}catch(_){}
  };
  const onTouchEnd=(e)=>{
    const t=e.target;
    if(t===rangeButton){
      e.stopImmediatePropagation();
      startRangeMode();
      minInput.readOnly=false;
      minInput.classList.add('range-active');
      minInput.setAttribute('inputmode','numeric');
      minInput.focus({preventScroll:true});
      try{minInput.setSelectionRange(minInput.value.length,minInput.value.length)}catch(_){}
      return;
    }
    if(t===minInput||t===maxInput){
      e.stopImmediatePropagation();
      focusInput(t);
    }
  };
  rangeButton.addEventListener('touchend',onTouchEnd,{capture:true,passive:false});
  minInput.addEventListener('touchend',onTouchEnd,{capture:true,passive:false});
  maxInput.addEventListener('touchend',onTouchEnd,{capture:true,passive:false});
})();
</script>
