<style>

;text-align:left;background:rgba(31,41,55,.7);border:1px solid #374151;border-radius:7px}.settings-notice.expanded .settings-details{display:block}.settings-details-title{font-weight:700;margin-bottom:3px}.settings-details-line{margin:2px 0}@media(min-width:901px){.container{position:relative}.previous-wrap{position:static}.history-panel{position:absolute;top:clamp(10px,1.5vw,20px);left:clamp(10px,1.5vw,20px);width:210px;height:min(48vh,430px);background:rgba(31,41,55,.92);border:1px solid #4b5563;border-radius:10px;box-shadow:0 8px 25px rgba(0,0,0,.3);overflow:hidden;z-index:5}.history-header{height:42px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;background:#374151;color:#f9fafb;font-size:17px;font-weight:700;cursor:pointer;user-select:none}.history-count{font-size:14px;color:#d1d5db}.history-toggle{font-size:16px}.history-panel.collapsed{height:42px}.history-panel.collapsed #previousNumbers{display:none}.history-panel #previousNumbers{height:calc(100% - 42px);min-height:0;padding:8px 6px;text-align:left;font-size:17px;line-height:1.35}.history-panel .previous-number{width:84px;margin:2px 4px;display:inline-block;text-align:center}.history-panel.collapsed .history-header{border-radius:10px}}@media(max-width:600px){.container{padding:5px;gap:3px}.site-description{display:none}.range-controls{gap:4px}.range-label{font-size:10px}.range-input{width:68px}.range-button{padding:0 8px}.voice-controls,.duplicate-controls{gap:4px}.voice-controls{grid-template-columns:1fr 1.5fr}.duplicate-controls{grid-template-columns:auto 1fr}.display-count-controls{gap:4px}.display-count-input{width:82px!important}.settings-notice{font-size:9px}.buttons{grid-template-columns:1fr}.interval-menu{left:5%;right:5%}.key-text{font-size:8px}}@media(max-height:700px){.range-controls{gap:4px}.range-input,.range-button{height:32px}.range-info{font-size:9px}.voice-controls button,.voice-controls select,.duplicate-controls select{min-height:32px;height:32px}.display-count-controls{gap:4px}.display-count-input{height:32px!important}}@media(max-height:600px){.container{gap:2px;padding-top:3px;padding-bottom:3px}.site-description{display:none}#number{font-size:clamp(38px,17vh,125px)}#previousNumbers{min-height:35px;font-size:10px}.buttons{gap:3px}.buttons button,.interval-controls button,.voice-controls button,.voice-controls select,.duplicate-controls select{min-height:32px;height:6.5vh;padding:2px 4px;border-radius:6px}.main-text{font-size:clamp(12px,2.5vh,17px)}.key-text{font-size:6px;margin-top:1px}.interval-arrow{font-size:clamp(18px,3.5vh,30px)}.interval-menu{max-height:38vh}.display-count-controls{gap:3px}.display-count-input{height:32px!important}}@media(max-height:450px){#number{font-size:clamp(34px,15vh,95px)}#previousNumbers{min-height:30px}.key-text{display:none}.buttons button,.interval-controls button,.voice-controls button,.voice-controls select,.duplicate-controls select{min-height:28px;height:6vh}.interval-option{min-height:30px!important}.range-label{font-size:9px}.range-input,.range-button{height:28px}.range-input{width:62px}.range-button{font-size:10px}.voice-controls,.duplicate-controls{gap:3px}.voice-controls{grid-template-columns:1fr 1.5fr}.duplicate-controls{grid-template-columns:auto 1fr}.display-count-controls{gap:3px}.display-count-input{width:76px!important;height:28px!important}.settings-notice{font-size:8px}}

<body>
<main class="container">
<div id="number">0000</div><section class="site-description"><h1>ランダム4桁数字表示</h1><p>0000〜9999の4桁数字を、設定した最小値〜最大値の範囲でランダムな順番に表示します。</p></section><div id="position">1 / 10000</div>
<div class="range-controls"><span class="range-label">最小</span><input id="minInput" class="range-input" type="text" inputmode="numeric" maxlength="4" value="0" aria-label="最小値"><span class="range-label">〜</span><span class="range-label">最大</span><input id="maxInput" class="range-input" type="text" inputmode="numeric" maxlength="4" value="9999" aria-label="最大値"><button id="rangeButton" class="range-button" type="button"><span class="main-text">数字範囲選択</span><span class="key-text">・ ? /</span></button></div>
<div class="duplicate-controls"><span class="range-label">重複</span><select id="duplicateSelect" class="duplicate-select" aria-label="重複の有無"><option value="off">なし（重複しない）</option><option value="on">あり（重複する）</option></select></div>
<div class="display-count-controls"><span class="range-label">表示回数</span><input id="displayCountInput" class="range-input display-count-input" type="text" inputmode="numeric" value="10000" aria-label="表示回数"><button id="displayCountButton" class="range-button" type="button"><span class="main-text">表示回数入力</span><span class="key-text">ｃ・c・C・Ｃ</span></button></div>
<div id="rangeInfo">現在の範囲：0000 〜 9999</div>
<div id="settingsNotice" class="settings-notice" hidden role="button" tabindex="0" aria-expanded="false"><div class="settings-notice-main"><span id="settingsNoticeText"></span><span id="settingsNoticeArrow" class="settings-notice-arrow">⌄</span></div><div id="settingsDetails" class="settings-details"><div class="settings-details-title">変更内容</div><div id="settingsDetailsLines"></div></div></div>
<div id="status">自動表示停止中</div>
<div class="previous-wrap"><div class="history-panel"><div class="history-header" id="historyToggle" role="button" tabindex="0" aria-expanded="true"><span>履歴 <span class="history-count" id="historyCount">0件</span></span><span class="history-toggle" id="historyArrow">▾</span></div><div id="previousNumbers"></div></div></div>
<div class="buttons"><button id="prevButton" type="button"><span class="main-text">前の数字</span><span class="key-text">バックスペース・左・下・A・S・J</span></button><button id="nextButton" type="button"><span class="main-text">次の数字</span><span class="key-text">エンター・右・上・L・D・W</span></button><button id="autoButton" type="button"><span class="main-text" id="autoMainText">自動表示開始</span><span class="key-text">スペース・K・Q</span></button>
<div class="interval-controls"><button id="intervalDecrease" class="interval-arrow" type="button">＜</button><button id="intervalButton" class="interval-display" type="button"><span class="main-text" id="intervalText">3秒</span></button><button id="intervalIncrease" class="interval-arrow" type="button">＞</button><div id="intervalMenu" class="interval-menu" role="listbox"></div></div>
<button id="firstButton" type="button"><span class="main-text">最初に戻る</span><span class="key-text">1キー</span></button><button id="lastButton" type="button"><span class="main-text">最後に進む</span><span class="key-text">9キー</span></button><button id="resetButton" type="button"><span class="main-text">リセット</span><span class="key-text">0キー</span></button><div class="voice-controls"><button id="voiceToggle" class="voice-toggle" type="button">🔇 音声読み上げ：OFF</button><select id="voiceSelect" class="voice-select" aria-label="読み上げ音声"></select></div></div>
</main>
<script>
const INTERVALS=[['0.1秒',100],['0.2秒',200],['0.3秒',300],['0.4秒',400],['0.5秒',500],['0.6秒',600],['0.7秒',700],['0.8秒',800],['0.9秒',900],['1秒',1000],['1.1秒',1100],['1.2秒',1200],['1.3秒',1300],['1.4秒',1400],['1.5秒',1500],['1.6秒',1600],['1.7秒',1700],['1.8秒',1800],['1.9秒',1900],['2秒',2000],['2.1秒',2100],['2.2秒',2200],['2.3秒',2300],['2.4秒',2400],['2.5秒',2500],['2.6秒',2600],['2.7秒',2700],['2.8秒',2800],['2.9秒',2900],['3秒',3000],['5秒',5000],['10秒',10000],['15秒',15000],['20秒',20000],['30秒',30000],['45秒',45000],['1分',60000],['1分30秒',90000],['2分',120000],['2分30秒',150000],['3分',180000],['3分30秒',210000],['4分',240000],['4分30秒',270000],['5分',300000]];
const $=id=>document.getElementById(id);const numberEl=$('number'),positionEl=$('position'),statusEl=$('status'),prevNums=$('previousNumbers'),nextBtn=$('nextButton'),prevBtn=$('prevButton'),autoBtn=$('autoButton'),autoText=$('autoMainText'),firstBtn=$('firstButton'),lastBtn=$('lastButton'),resetBtn=$('resetButton'),decBtn=$('intervalDecrease'),intBtn=$('intervalButton'),incBtn=$('intervalIncrease'),intText=$('intervalText'),menu=$('intervalMenu'),minInput=$('minInput'),maxInput=$('maxInput'),rangeButton=$('rangeButton'),rangeInfo=$('rangeInfo'),duplicateSelect=$('duplicateSelect'),displayCountInput=$('displayCountInput'),displayCountButton=$('displayCountButton'),settingsNotice=$('settingsNotice'),settingsNoticeText=$('settingsNoticeText'),settingsNoticeArrow=$('settingsNoticeArrow'),settingsDetailsLines=$('settingsDetailsLines'),voiceToggle=$('voiceToggle'),voiceSelect=$('voiceSelect'),historyPanel=document.querySelector('.history-panel'),historyToggle=$('historyToggle'),historyArrow=$('historyArrow'),historyCount=$('historyCount');
let minNumber=0,maxNumber=9999,allowDuplicates=false,displayCount=10000n,numbers=[],currentIndex=0n,autoRunning=false,autoTimer=null,intervalIndex=29,rangeMode=0,rangeBuffer='',rangeTyping=false,displayCountMode=false,displayCountTyping=false,displayCountOriginalValue='',voiceEnabled=false,selectedVoice=null,availableVoices=[],noticeType='';
const MASK64=(1n<<64n)-1n;
function rangeSize(){return BigInt(maxNumber-minNumber+1)}
function snapshot(){return{min:minNumber,max:maxNumber,dup:allowDuplicates,count:displayCount}}
function fmt(n){return String(n).padStart(4,'0')}
function fmtCount(n){return n.toString()}
let duplicateSeed=1n;
function numberAt(index){if(!allowDuplicates)return numbers[Number(index)];let x=(duplicateSeed+BigInt(index)+0x9e3779b97f4a7c15n)&MASK64;x=(x^(x>>30n))*0xbf58476d1ce4e5b9n&MASK64;x=(x^(x>>27n))*0x94d049bb133111ebn&MASK64;x^=x>>31n;return Number(x%rangeSize())+minNumber}
function createRandomNumbers(){currentIndex=0n;if(allowDuplicates){numbers=[];duplicateSeed=BigInt(Math.floor(Math.random()*4294967296))}else{numbers=Array.from({length:maxNumber-minNumber+1},(_,i)=>i+minNumber);for(let i=numbers.length-1;i>0;i--){let r=Math.floor(Math.random()*(i+1));[numbers[i],numbers[r]]=[numbers[r],numbers[i]]}}}
function speakNumber(){if(!voiceEnabled||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let text=fmt(numberAt(currentIndex)).split('').join(' ');let u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';if(selectedVoice)u.voice=selectedVoice;u.rate=1;u.pitch=1;window.speechSynthesis.speak(u)}
function loadVoices(){if(!('speechSynthesis'in window)){voiceSelect.disabled=true;voiceToggle.disabled=true;voiceToggle.textContent='🔇 音声非対応';return}const all=window.speechSynthesis.getVoices();const seen=new Set();availableVoices=all.filter(v=>{const lang=String(v.lang||'').trim().toLowerCase();if(!/^ja(?:-|$)/.test(lang))return false;const key=v.voiceURI||`${v.name}|${v.lang}`;if(seen.has(key))return false;seen.add(key);return true}).sort((a,b)=>{const al=String(a.lang||'').toLowerCase(),bl=String(b.lang||'').toLowerCase();if(al!==bl)return al.localeCompare(bl);return String(a.name||'').localeCompare(String(b.name||''),'ja')});voiceSelect.innerHTML='';if(!availableVoices.length){let o=document.createElement('option');o.value='';o.textContent='日本語音声なし（端末設定を確認）';voiceSelect.appendChild(o);voiceSelect.disabled=true;return}voiceSelect.disabled=false;availableVoices.forEach((v,i)=>{let o=document.createElement('option');o.value=String(i);o.textContent=v.name+'（'+v.lang+'）';voiceSelect.appendChild(o)});let saved=localStorage.getItem('randomNumberVoice');let idx=availableVoices.findIndex(v=>v.voiceURI===saved);if(idx<0)idx=0;voiceSelect.value=String(idx);selectedVoice=availableVoices[idx]}
function setVoiceEnabled(enabled){voiceEnabled=enabled;voiceToggle.textContent=enabled?'🔊 音声読み上げ：ON':'🔇 音声読み上げ：OFF';voiceToggle.classList.toggle('on',enabled);if(!enabled&&'speechSynthesis'in window)window.speechSynthesis.cancel()}
function cycleVoice(){if(!availableVoices.length||voiceSelect.disabled)return;let i=availableVoices.findIndex(v=>v.voiceURI===selectedVoice?.voiceURI);i=(i+1)%availableVoices.length;selectedVoice=availableVoices[i];voiceSelect.value=String(i);localStorage.setItem('randomNumberVoice',selectedVoice.voiceURI);if(voiceEnabled)speakNumber()}
function clearTemporaryNotice(){if(noticeType==='temporary')hideNotice()}
function hideNotice(){settingsNotice.hidden=true;settingsNotice.classList.remove('expanded');settingsNotice.setAttribute('aria-expanded','false');settingsNoticeArrow.textContent='⌄';settingsNoticeText.textContent='';settingsDetailsLines.innerHTML='';noticeType=''}
function showNotice(text,before,after,temporary){settingsNotice.hidden=false;settingsNoticeText.textContent=text;settingsDetailsLines.innerHTML=`<div class="settings-details-line">範囲：${fmt(before.min)}〜${fmt(before.max)} → ${fmt(after.min)}〜${fmt(after.max)}</div><div class="settings-details-line">重複：${before.dup?'あり':'なし'} → ${after.dup?'あり':'なし'}</div><div class="settings-details-line">表示回数：${fmtCount(before.count)}回 → ${fmtCount(after.count)}回${temporary?'（自動調整）':''}</div>`;settingsNotice.classList.remove('expanded');settingsNotice.setAttribute('aria-expanded','false');settingsNoticeArrow.textContent='⌄';noticeType=temporary?'temporary':'pending'}
function pendingSnapshot(){let min=Number(minInput.value),max=Number(maxInput.value),raw=normalizeDigits(displayCountInput.value).replace(/\D/g,'');let count=null;try{if(raw)count=BigInt(raw)}catch(_){}return{min,max,dup:duplicateSelect.value==='on',count,validRange:Number.isInteger(min)&&Number.isInteger(max)&&min>=0&&max<=9999&&min<=max,validCount:count!==null&&count>=1n}}
function pendingDiff(){const p=pendingSnapshot();const rangeChanged=String(minInput.value)!==String(minNumber)||String(maxInput.value)!==String(maxNumber);const dupChanged=p.dup!==allowDuplicates;const countChanged=p.validCount?p.count!==displayCount:String(displayCountInput.value)!==fmtCount(displayCount);const invalid=!p.validRange||!p.validCount;return{p,count:invalid?1:(rangeChanged?1:0)+(dupChanged?1:0)+(countChanged?1:0),range:rangeChanged||!p.validRange,dup:dupChanged,countDiff:countChanged||!p.validCount}}
function updatePendingNotice(){const d=pendingDiff();if(!d.count){hideNotice();return}let text;if(d.count>1)text='設定を変更しました ／ 0キーまたはリセットで適用';else if(d.range)text='数字範囲を変更しました ／ 0キーまたはリセットで適用';else if(d.dup)text=`重複を「${d.p.dup?'あり':'なし'}」に変更しました ／ 0キーまたはリセットで適用`;else text='表示回数を変更しました ／ 0キーまたはリセットで適用';const afterCount=d.p.validCount?d.p.count:displayCount;showNotice(text,snapshot(),{min:d.p.min,max:d.p.max,dup:d.p.dup,count:afterCount},false)}
function syncInputs(){minInput.value=minNumber;maxInput.value=maxNumber;duplicateSelect.value=allowDuplicates?'on':'off';displayCountInput.value=fmtCount(displayCount)}
function displayNumber(){const current=numberAt(currentIndex);numberEl.textContent=fmt(current);positionEl.textContent=`${currentIndex+1n} / ${displayCount}`;if(!rangeMode)rangeInfo.textContent=`現在の範囲：${fmt(minNumber)} 〜 ${fmt(maxNumber)}`;prevNums.innerHTML='';const count=Number(currentIndex);for(let i=0;i<count;i++){let s=document.createElement('span');s.className='previous-number';s.textContent=fmt(numberAt(BigInt(i)));prevNums.appendChild(s)}prevNums.scrollTop=prevNums.scrollHeight;if(historyCount)historyCount.textContent=`${currentIndex}件`;statusEl.textContent=autoRunning?'自動表示中':'自動表示停止中';autoText.textContent=autoRunning?'自動表示停止':'自動表示開始';autoBtn.classList.toggle('running',autoRunning);speakNumber()}
function flash(b){b.classList.add('active');setTimeout(()=>b.classList.remove('active'),120)}
function restartTimer(){if(!autoRunning)return;if(autoTimer)clearTimeout(autoTimer);autoTimer=setTimeout(autoNext,INTERVALS[intervalIndex][1])}
function nextNumber(){if(currentIndex<displayCount-1n)currentIndex++;else{if(autoRunning)stopAuto();return}displayNumber();restartTimer()}
function previousNumber(){if(currentIndex>0n)currentIndex--;displayNumber();restartTimer()}
function goFirst(){currentIndex=0n;displayNumber();restartTimer()}
function goLast(){currentIndex=displayCount-1n;if(autoRunning)stopAuto();else displayNumber()}
function autoNext(){if(!autoRunning)return;if(currentIndex>=displayCount-1n){stopAuto();return}currentIndex++;displayNumber();if(currentIndex<displayCount-1n)restartTimer();else stopAuto()}
function startAuto(){if(autoRunning||currentIndex>=displayCount-1n)return;autoRunning=true;displayNumber();restartTimer()}
function stopAuto(){autoRunning=false;if(autoTimer)clearTimeout(autoTimer);autoTimer=null;displayNumber()}
function toggleAuto(){autoRunning?stopAuto():startAuto()}
function applySettings(){const p=pendingSnapshot();if(!p.validRange){rangeInfo.textContent='最小値・最大値は 0000〜9999 の整数で、最小値≦最大値にしてください';rangeInfo.classList.add('range-error');restartTimer();return}if(!p.validCount){rangeInfo.textContent='表示回数は1以上の整数で入力してください';rangeInfo.classList.add('range-error');restartTimer();return}rangeInfo.classList.remove('range-error');const before=snapshot();let finalCount=p.count,corrected=false;if(!p.dup&&finalCount>BigInt(p.max-p.min+1)){finalCount=BigInt(p.max-p.min+1);corrected=true}const wasAuto=autoRunning;if(autoTimer)clearTimeout(autoTimer);minNumber=p.min;maxNumber=p.max;allowDuplicates=p.dup;displayCount=finalCount;syncInputs();createRandomNumbers();hideNotice();displayNumber();if(corrected)showNotice(`重複なしのため${fmtCount(p.count)}回から${fmtCount(finalCount)}回に自動調整されました`,before,snapshot(),true);if(wasAuto)restartTimer()}
function resetNumbers(){clearTemporaryNotice();const d=pendingDiff();if(d.p.count===0){createRandomNumbers();displayNumber();restartTimer();return}applySettings()}
function updateInterval(){intText.textContent=INTERVALS[intervalIndex][0];[...menu.children].forEach((b,i)=>b.classList.toggle('selected',i===intervalIndex))}
function setIntervalIndex(i){intervalIndex=Math.max(0,Math.min(INTERVALS.length-1,i));updateInterval();restartTimer()}
INTERVALS.forEach((x,i)=>{let b=document.createElement('button');b.type='button';b.className='interval-option';b.textContent=x[0];b.onclick=e=>{e.stopPropagation();if(rangeMode||displayCountMode)return;clearTemporaryNotice();flash(b);setIntervalIndex(i);menu.classList.remove('open')};menu.appendChild(b)});updateInterval();
function setRangeInputFocus(mode,selectValue=false){minInput.classList.toggle('range-active',mode===1);maxInput.classList.toggle('range-active',mode===2);if(mode===1){minInput.focus({preventScroll:true});if(selectValue)try{minInput.select()}catch(_){}}if(mode===2){maxInput.focus({preventScroll:true});if(selectValue)try{maxInput.select()}catch(_){}}}
function cancelRangeMode(){rangeMode=0;rangeBuffer='';rangeTyping=false;minInput.readOnly=false;maxInput.readOnly=false;minInput.blur();maxInput.blur();setRangeInputFocus(0);statusEl.textContent=autoRunning?'自動表示中':'自動表示停止中'}
function startRangeMode(){rangeMode=1;rangeBuffer='';rangeTyping=false;minInput.readOnly=false;maxInput.readOnly=true;minInput.setAttribute('inputmode','numeric');maxInput.setAttribute('inputmode','numeric');setRangeInputFocus(1,true);rangeInfo.textContent='最小値を入力 → Enterで決定';rangeInfo.classList.remove('range-error');clearTemporaryNotice()}
function normalizeDigits(value){return String(value).replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0))}
function finishRangeInput(value,mode){let v=normalizeDigits(value).replace(/\D/g,'');if(v==='')return false;let n=Number(v);if(!Number.isInteger(n)||n<0||n>9999){rangeInfo.textContent='0000〜9999で入力してください';rangeInfo.classList.add('range-error');return false}if(mode===1){minInput.value=n;rangeMode=2;rangeBuffer='';rangeTyping=false;minInput.readOnly=true;maxInput.readOnly=false;minInput.classList.remove('range-active');maxInput.classList.add('range-active');setRangeInputFocus(2,true);rangeInfo.textContent='最大値を入力 → Enterで決定';return true}maxInput.value=n;cancelRangeMode();rangeInfo.textContent=`範囲設定完了：${fmt(Number(minInput.value))} 〜 ${fmt(n)} ／ 0キーまたはリセットで適用`;rangeInfo.classList.remove('range-error');updatePendingNotice();return true}
[minInput,maxInput].forEach(input=>input.addEventListener('input',()=>{if(!rangeMode||input.readOnly)return;let v=normalizeDigits(input.value).replace(/\D/g,'').slice(0,4);if(input.value!==v)input.value=v;rangeBuffer=v;rangeTyping=true}));
function startDisplayCountMode(){clearTemporaryNotice();displayCountMode=true;displayCountTyping=false;displayCountOriginalValue=displayCountInput.value;displayCountInput.readOnly=false;displayCountInput.setAttribute('inputmode','numeric');displayCountInput.classList.add('range-active');displayCountInput.focus({preventScroll:true});try{displayCountInput.select()}catch(_){} }
function finishDisplayCountInput(){if(!displayCountMode)return true;let v=normalizeDigits(displayCountInput.value).replace(/\D/g,'');if(!displayCountTyping||v===''){displayCountInput.value=displayCountOriginalValue;displayCountMode=false;displayCountInput.classList.remove('range-active');displayCountInput.blur();rangeInfo.classList.remove('range-error');updatePendingNotice();return true}let n;try{n=BigInt(v)}catch(_){return false}if(n<1n){rangeInfo.textContent='表示回数は1以上の整数で入力してください';rangeInfo.classList.add('range-error');return false}displayCountInput.value=n.toString();displayCountMode=false;displayCountInput.classList.remove('range-active');displayCountInput.blur();rangeInfo.classList.remove('range-error');updatePendingNotice();return true}
displayCountInput.addEventListener('input',()=>{if(!displayCountMode)return;let v=normalizeDigits(displayCountInput.value).replace(/\D/g,'');if(displayCountInput.value!==v)displayCountInput.value=v;displayCountTyping=v.length>0});
displayCountButton.onclick=e=>{e.preventDefault();if(rangeMode)return;clearTemporaryNotice();flash(displayCountButton);startDisplayCountMode()};
displayCountInput.addEventListener('pointerdown',e=>{if(rangeMode)return;startDisplayCountMode();e.stopPropagation()},{capture:true});
displayCountInput.addEventListener('click',e=>{if(rangeMode)return;displayCountInput.focus({preventScroll:true});try{displayCountInput.select()}catch(_){ }e.stopPropagation()},{capture:true});
displayCountInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopImmediatePropagation();finishDisplayCountInput()}else if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();displayCountInput.value=displayCountOriginalValue;displayCountMode=false;displayCountInput.classList.remove('range-active');displayCountInput.blur();rangeInfo.classList.remove('range-error');updatePendingNotice()}},{capture:true});
voiceToggle.onclick=()=>{if(rangeMode||displayCountMode)return;clearTemporaryNotice();flash(voiceToggle);setVoiceEnabled(!voiceEnabled);if(voiceEnabled)speakNumber();restartTimer()};
voiceSelect.onchange=()=>{if(rangeMode||displayCountMode)return;clearTemporaryNotice();let i=Number(voiceSelect.value);selectedVoice=availableVoices[i]||null;if(selectedVoice)localStorage.setItem('randomNumberVoice',selectedVoice.voiceURI);if(voiceEnabled)speakNumber();restartTimer()};
if('speechSynthesis'in window){window.speechSynthesis.addEventListener('voiceschanged',loadVoices);loadVoices()}
duplicateSelect.onchange=()=>{if(rangeMode||displayCountMode){duplicateSelect.value=allowDuplicates?'on':'off';return}clearTemporaryNotice();updatePendingNotice()};
settingsNotice.onclick=()=>{if(settingsNotice.hidden)return;let expanded=settingsNotice.classList.toggle('expanded');settingsNotice.setAttribute('aria-expanded',String(expanded));settingsNoticeArrow.textContent=expanded?'⌃':'⌄'};settingsNotice.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();settingsNotice.click()}};
nextBtn.onclick=()=>{if(rangeMode||displayCountMode)return;clearTemporaryNotice();flash(nextBtn);nextNumber()};prevBtn.onclick=()=>{if(rangeMode||displayCountMode)return;clearTemporaryNotice();flash(prevBtn);previousNumber()};autoBtn.onclick=()=>{if(rangeMode||displayCountMode)return;clearTemporaryNotice();flash(autoBtn);toggleAuto()};firstBtn.onclick=()=>{if(rangeMode||displayCountMode)return;clearTemporaryNotice();flash(firstBtn);goFirst()};lastBtn.onclick=()=>{if(rangeMode||displayCountMode)return;clearTemporaryNotice();flash(lastBtn);goLast()};resetBtn.onclick=()=>{if(rangeMode||displayCountMode)return;flash(resetBtn);resetNumbers()};rangeButton.onclick=()=>{if(rangeMode)return;flash(rangeButton);startRangeMode()};decBtn.onclick=()=>{if(rangeMode||displayCountMode)return;clearTemporaryNotice();flash(decBtn);setIntervalIndex(intervalIndex-1)};incBtn.onclick=()=>{if(rangeMode||displayCountMode)return;clearTemporaryNotice();flash(incBtn);setIntervalIndex(intervalIndex+1)};intBtn.onclick=e=>{e.stopPropagation();if(rangeMode||displayCountMode)return;clearTemporaryNotice();flash(intBtn);menu.classList.toggle('open')};document.addEventListener('click',e=>{if(!e.target.closest('.interval-controls'))menu.classList.remove('open')});
document.addEventListener('keydown',e=>{if(rangeMode){let input=rangeMode===1?minInput:maxInput;if(e.target!==input)return;return}if(displayCountMode){if(e.target!==displayCountInput)return;return}if(e.target.matches('input,select'))return;let k=e.key;if(k==='c'||k==='C'||k==='ｃ'||k==='Ｃ'||e.code==='KeyC'){e.preventDefault();clearTemporaryNotice();flash(displayCountButton);startDisplayCountMode();return}if(k==='b'||k==='B'){e.preventDefault();clearTemporaryNotice();flash(voiceToggle);setVoiceEnabled(!voiceEnabled);if(voiceEnabled)speakNumber();restartTimer();return}if(k==='v'||k==='V'){e.preventDefault();clearTemporaryNotice();flash(voiceSelect);cycleVoice();restartTimer();return}if(k==='/'||k==='?'||k==='？'||k==='・'||e.code==='Slash'){e.preventDefault();flash(rangeButton);startRangeMode();return}if(k==='Enter'||k==='ArrowRight'||k==='ArrowUp'||/^[lLdDwW]$/.test(k)){e.preventDefault();clearTemporaryNotice();flash(nextBtn);nextNumber();return}if(k==='Backspace'||k==='ArrowLeft'||k==='ArrowDown'||/^[aAsSjJ]$/.test(k)){e.preventDefault();clearTemporaryNotice();flash(prevBtn);previousNumber();return}if(k===' '||/^[kKqQ]$/.test(k)){e.preventDefault();clearTemporaryNotice();flash(autoBtn);toggleAuto();return}if(k==='1'){e.preventDefault();clearTemporaryNotice();flash(firstBtn);goFirst();return}if(k==='9'){e.preventDefault();clearTemporaryNotice();flash(lastBtn);goLast();return}if(k==='0'){e.preventDefault();flash(resetBtn);resetNumbers();return}if(k==='<'||k==='＜'||e.code==='Comma'){e.preventDefault();clearTemporaryNotice();flash(decBtn);setIntervalIndex(intervalIndex-1);return}if(k==='>'||k==='＞'||e.code==='Period'){e.preventDefault();clearTemporaryNotice();flash(incBtn);setIntervalIndex(intervalIndex+1);return}});
// RANGE_INPUT_DEVICE_FIX_V6
(()=>{const setInputMode=input=>{const mode=input===minInput?1:2;if(rangeMode===0)startRangeMode();rangeMode=mode;rangeBuffer='';rangeTyping=false;minInput.readOnly=mode!==1;maxInput.readOnly=mode!==2;minInput.classList.toggle('range-active',mode===1);maxInput.classList.toggle('range-active',mode===2);rangeInfo.classList.remove('range-error');rangeInfo.textContent=mode===1?'最小値を入力 → Enterで決定':'最大値を入力 → Enterで決定';input.readOnly=false;input.setAttribute('inputmode','numeric');input.focus({preventScroll:true});try{input.select()}catch(_){}};[minInput,maxInput].forEach(input=>{input.addEventListener('pointerdown',e=>{setInputMode(input);e.stopPropagation()},{capture:true});input.addEventListener('click',e=>{if(!input.readOnly){input.focus({preventScroll:true});try{input.select()}catch(_){}}e.stopPropagation()},{capture:true});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopImmediatePropagation();finishRangeInput(input.value,input===minInput?1:2)}else if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();cancelRangeMode()}},{capture:true})})})();
// RANGE_BLANK_TAP_CONFIRM_V1
(()=>{let blankTapHandled=false;const confirmBlank=()=>{if(rangeMode){const input=rangeMode===1?minInput:maxInput;finishRangeInput(input.value,rangeMode)}else if(displayCountMode)finishDisplayCountInput()};const isProtected=e=>e.target.closest('input,button,select,#settingsNotice');document.addEventListener('pointerup',e=>{if(isProtected(e)){blankTapHandled=false;return}if((!rangeMode&&!displayCountMode)||blankTapHandled)return;blankTapHandled=true;confirmBlank()},{capture:true});document.addEventListener('click',e=>{if(isProtected(e)){blankTapHandled=false;return}if((!rangeMode&&!displayCountMode)||blankTapHandled)return;blankTapHandled=true;confirmBlank()},{capture:true})})();
rangeButton.title='数字範囲選択を開始';createRandomNumbers();syncInputs();displayNumber();
function toggleHistory(){if(!historyPanel)return;let collapsed=historyPanel.classList.toggle('collapsed');historyArrow.textContent=collapsed?'▸':'▾';historyToggle.setAttribute('aria-expanded',String(!collapsed));}historyToggle?.addEventListener('click',toggleHistory);historyToggle?.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleHistory()}});
</script>
