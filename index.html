
<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<style>

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: #111827;
  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;
}


/* =====================================
   全体
   ===================================== */

.container {
  width: min(1200px, 100%);
  height: 100vh;
  max-height: 100vh;

  padding:
    clamp(6px, 1.5vh, 25px)
    clamp(6px, 2vw, 30px);

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;

  text-align: center;

  overflow: hidden;
}


/* =====================================
   現在の数字
   ===================================== */

#number {
  font-family:
    "Courier New",
    monospace;

  font-size:
    clamp(
      60px,
      min(22vw, 25vh),
      300px
    );

  font-weight: 800;

  line-height: 0.9;

  letter-spacing: 0.05em;

  margin:
    5px 0 10px;

  color: #ffffff;

  text-shadow:
    0 0 20px rgba(255,255,255,0.2),
    0 0 50px rgba(59,130,246,0.25);

  user-select: none;

  flex-shrink: 1;
}


/* =====================================
   現在位置
   ===================================== */

#position {
  font-size:
    clamp(16px, 3vh, 30px);

  font-weight: 600;

  color: #d1d5db;

  margin-bottom:
    clamp(3px, 1vh, 8px);

  user-select: none;

  flex-shrink: 0;
}


/* =====================================
   状態
   ===================================== */

#status {
  min-height: 0;

  margin-bottom:
    clamp(5px, 1.5vh, 20px);

  font-size:
    clamp(12px, 2vh, 18px);

  color: #9ca3af;

  user-select: none;

  flex-shrink: 0;
}


/* =====================================
   過去の数字
   ===================================== */

#previousNumbers {
  width: 100%;

  height:
    clamp(40px, 18vh, 350px);

  max-height: 18vh;

  overflow-y: auto;
  overflow-x: hidden;

  padding:
    clamp(3px, 0.8vh, 15px)
    10px;

  margin-bottom:
    clamp(5px, 1.5vh, 25px);

  color: #d1d5db;

  font-family:
    "Courier New",
    monospace;

  font-size:
    clamp(12px, 2.2vh, 25px);

  line-height: 1.5;

  text-align: center;

  flex-shrink: 1;
}


/* =====================================
   過去数字
   ===================================== */

.previous-number {
  display: inline-block;

  margin:
    2px 8px;

  white-space: nowrap;
}


/* =====================================
   ボタン
   ===================================== */

.buttons {
  width: 100%;

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap:
    clamp(5px, 1.2vh, 16px);

  flex-shrink: 0;
}


button {
  border: none;

  border-radius:
    clamp(8px, 1.5vh, 16px);

  min-height:
    clamp(55px, 10vh, 110px);

  height:
    clamp(55px, 10vh, 110px);

  padding:
    clamp(5px, 1vh, 15px);

  color: white;

  cursor: pointer;

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;

  transition:
    transform 0.08s,
    filter 0.15s,
    box-shadow 0.15s;

  box-shadow:
    0 6px 15px
    rgba(0,0,0,0.25);

  -webkit-tap-highlight-color:
    transparent;
}


button:hover {
  filter: brightness(1.15);
}


/* =====================================
   ボタンを押した状態
   ===================================== */

button:active,
button.active {
  transform:
    scale(0.96);

  filter:
    brightness(0.82);

  box-shadow:

    inset
    0 4px 8px
    rgba(0,0,0,0.25),

    0 2px 5px
    rgba(0,0,0,0.25);
}


/* =====================================
   ボタン文字
   ===================================== */

.main-text {
  font-size:
    clamp(16px, 3vh, 34px);

  font-weight: 700;

  line-height: 1.1;
}


.key-text {
  margin-top:
    clamp(2px, 0.5vh, 8px);

  font-size:
    clamp(8px, 1.5vh, 15px);

  opacity: 0.9;

  line-height: 1.2;
}


/* =====================================
   ボタンカラー
   ===================================== */

#nextButton {
  background: #2563eb;
}

#prevButton {
  background: #16a34a;
}

#autoButton {
  background: #d97706;
}

#firstButton {
  background: #7c3aed;
}

#lastButton {
  background: #db2777;
}

#resetButton {
  background: #dc2626;
}


/* =====================================
   自動表示中
   ===================================== */

#autoButton.running {
  background: #0891b2;
}


/* =====================================
   低い画面
   ===================================== */

@media (max-height: 700px) {

  #number {
    font-size:
      clamp(55px, 20vh, 180px);

    margin:
      0 0 5px;
  }

  #previousNumbers {
    height: 12vh;
    max-height: 12vh;
    margin-bottom: 5px;
  }

  .buttons {
    gap: 6px;
  }

  button {
    min-height: 55px;
    height: 8vh;
  }
}


/* =====================================
   非常に低い画面
   ===================================== */

@media (max-height: 500px) {

  #number {
    font-size:
      clamp(45px, 17vh, 130px);
  }

  #position {
    font-size: 14px;
  }

  #status {
    font-size: 11px;
    margin-bottom: 3px;
  }

  #previousNumbers {
    height: 10vh;
    max-height: 10vh;

    font-size: 11px;
    line-height: 1.2;
  }

  button {
    min-height: 45px;
    height: 7vh;
    border-radius: 7px;
  }

  .main-text {
    font-size: 15px;
  }

  .key-text {
    font-size: 7px;
    margin-top: 2px;
  }
}


/* =====================================
   スマートフォン
   ===================================== */

@media (max-width: 600px) {

  .container {
    padding: 6px;
  }

  #number {
    font-size:
      clamp(
        60px,
        min(21vw, 15vh),
        150px
      );

    margin:
      5px 0 8px;
  }

  #previousNumbers {
    height: 12vh;
    max-height: 12vh;
    font-size: 13px;
  }

  .buttons {
    grid-template-columns:
      1fr;

    gap: 5px;
  }

  button {
    min-height: 50px;
    height: 8vh;
  }

  .main-text {
    font-size: 18px;
  }

  .key-text {
    font-size: 9px;
  }
}

</style>
  
  <title>ランダム4桁数字表示</title>

<meta name="description"
content="0000〜9999の4桁の数字をランダムな順番で表示するWebアプリです。次の数字、前の数字、自動表示、リセットなどが利用できます。">
  
</head>


<body>

<main class="container">


<!-- 現在の数字 -->

<div id="number">
0000
</div>


<!-- 現在位置 -->

<div id="position">
1 / 10000
</div>


<!-- 状態 -->

<div id="status">
自動表示停止中
</div>


<!-- 過去の数字 -->

<div id="previousNumbers">
</div>


<!-- ボタン -->

<div class="buttons">


<button id="nextButton" type="button">

<span class="main-text">
次の数字
</span>

<span class="key-text">
エンターキー、右方向キー、上方向キー、Lキー、Dキー、Wキー
</span>

</button>


<button id="prevButton" type="button">

<span class="main-text">
前の数字
</span>

<span class="key-text">
バックスペースキー、左方向キー、下方向キー、Aキー、Sキー、Jキー
</span>

</button>


<button id="autoButton" type="button">

<span
  class="main-text"
  id="autoMainText"
>
自動表示開始
</span>

<span class="key-text">
スペースキー、Kキー、Qキー
</span>

</button>


<button id="firstButton" type="button">

<span class="main-text">
最初に戻る
</span>

<span class="key-text">
1キー
</span>

</button>


<button id="lastButton" type="button">

<span class="main-text">
最後に進む
</span>

<span class="key-text">
9キー
</span>

</button>


<button id="resetButton" type="button">

<span class="main-text">
リセット
</span>

<span class="key-text">
0キー
</span>

</button>


</div>

</main>


<script>


// ======================================
// 設定
// ======================================

const TOTAL_NUMBERS = 10000;

const AUTO_INTERVAL = 5000;


// ======================================
// 状態
// ======================================

let numbers = [];

let currentIndex = 0;

let autoRunning = false;

let autoTimer = null;


// ======================================
// HTML要素
// ======================================

const numberElement =
  document.getElementById("number");

const positionElement =
  document.getElementById("position");

const statusElement =
  document.getElementById("status");

const previousNumbersElement =
  document.getElementById("previousNumbers");

const nextButton =
  document.getElementById("nextButton");

const prevButton =
  document.getElementById("prevButton");

const autoButton =
  document.getElementById("autoButton");

const firstButton =
  document.getElementById("firstButton");

const lastButton =
  document.getElementById("lastButton");

const resetButton =
  document.getElementById("resetButton");

const autoMainText =
  document.getElementById("autoMainText");


// ======================================
// 0〜9999を作成してシャッフル
// ======================================

function createRandomNumbers() {

  numbers = [];

  for (
    let i = 0;
    i < TOTAL_NUMBERS;
    i++
  ) {

    numbers.push(i);

  }


  // Fisher-Yatesシャッフル

  for (
    let i = numbers.length - 1;
    i > 0;
    i--
  ) {

    const randomIndex =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      numbers[i],
      numbers[randomIndex]
    ] =
    [
      numbers[randomIndex],
      numbers[i]
    ];

  }


  currentIndex = 0;

}


// ======================================
// 4桁表示
// ======================================

function formatNumber(number) {

  return String(number)
    .padStart(4, "0");

}


// ======================================
// 過去の数字を表示
//
// 一番遠い過去 → (1)
// その次 → (2)
// ...
// 一番近い過去 → 最後の番号
// ======================================

function displayPreviousNumbers() {

  previousNumbersElement.innerHTML = "";


  if (currentIndex === 0) {

    return;

  }


  for (
    let i = 0;
    i < currentIndex;
    i++
  ) {

    const span =
      document.createElement("span");


    span.className =
      "previous-number";


    span.textContent =
      `(${i + 1}) ${formatNumber(numbers[i])}`;


    previousNumbersElement
      .appendChild(span);

  }

}


// ======================================
// 画面全体を更新
// ======================================

function displayNumber() {

  // 現在の数字

  numberElement.textContent =
    formatNumber(
      numbers[currentIndex]
    );


  // 現在位置

  positionElement.textContent =
    `${currentIndex + 1} / ${TOTAL_NUMBERS}`;


  // 状態

  statusElement.textContent =
    autoRunning
      ? "自動表示中"
      : "自動表示停止中";


  // 過去の数字

  displayPreviousNumbers();

}


// ======================================
// ボタンを押した状態
// ======================================

function flashButton(button) {

  button.classList.remove("active");

  void button.offsetWidth;

  button.classList.add("active");

  setTimeout(
    () => {

      button.classList.remove("active");

    },
    120
  );

}


// ======================================
// 自動表示タイマーを5秒に統一
// ======================================

function restartAutoTimer() {

  if (!autoRunning) {

    return;

  }


  if (autoTimer !== null) {

    clearTimeout(autoTimer);

    autoTimer = null;

  }


  autoTimer =
    setTimeout(
      autoNext,
      AUTO_INTERVAL
    );

}


// ======================================
// 次の数字
// ======================================

function nextNumber() {

  if (
    currentIndex <
    numbers.length - 1
  ) {

    currentIndex++;

  }


  displayNumber();


  /*
   * 自動表示中に操作した場合、
   * その操作時点から5秒にリセット
   */

  if (autoRunning) {

    restartAutoTimer();

  }

}


// ======================================
// 前の数字
// ======================================

function previousNumber() {

  if (currentIndex > 0) {

    currentIndex--;

  }


  displayNumber();


  if (autoRunning) {

    restartAutoTimer();

  }

}


// ======================================
// 最初に戻る
// ======================================

function goToFirst() {

  currentIndex = 0;

  displayNumber();


  if (autoRunning) {

    restartAutoTimer();

  }

}


// ======================================
// 最後に進む
// ======================================

function goToLast() {

  currentIndex =
    numbers.length - 1;

  displayNumber();


  /*
   * 最後の数字に到達したので
   * 自動表示を停止
   */

  if (autoRunning) {

    stopAuto();

  }

}


// ======================================
// 自動表示
// ======================================

function autoNext() {

  if (!autoRunning) {

    return;

  }


  // 最後なら停止

  if (
    currentIndex >=
    numbers.length - 1
  ) {

    stopAuto();

    return;

  }


  currentIndex++;

  displayNumber();


  // 最後に到達したら停止

  if (
    currentIndex >=
    numbers.length - 1
  ) {

    stopAuto();

    return;

  }


  // 次の5秒

  autoTimer =
    setTimeout(
      autoNext,
      AUTO_INTERVAL
    );

}


// ======================================
// 自動表示開始
// ======================================

function startAuto() {

  if (autoRunning) {

    return;

  }


  // 最後なら開始しない

  if (
    currentIndex >=
    numbers.length - 1
  ) {

    return;

  }


  autoRunning = true;


  autoButton.classList.add(
    "running"
  );


  autoMainText.textContent =
    "自動表示停止";


  displayNumber();


  restartAutoTimer();

}


// ======================================
// 自動表示停止
// ======================================

function stopAuto() {

  autoRunning = false;


  if (autoTimer !== null) {

    clearTimeout(autoTimer);

    autoTimer = null;

  }


  autoButton.classList.remove(
    "running"
  );


  autoMainText.textContent =
    "自動表示開始";


  displayNumber();

}


// ======================================
// 自動表示切り替え
// ======================================

function toggleAuto() {

  if (autoRunning) {

    stopAuto();

  } else {

    startAuto();

  }

}


// ======================================
// リセット
// ======================================

function resetNumbers() {

  createRandomNumbers();


  displayNumber();


  /*
   * 自動表示中なら、
   * リセットした瞬間から5秒
   */

  if (autoRunning) {

    restartAutoTimer();

  }

}


// ======================================
// ボタン操作
// ======================================

nextButton.addEventListener(
  "click",
  () => {

    flashButton(nextButton);

    nextNumber();

  }
);


prevButton.addEventListener(
  "click",
  () => {

    flashButton(prevButton);

    previousNumber();

  }
);


autoButton.addEventListener(
  "click",
  () => {

    flashButton(autoButton);

    toggleAuto();

  }
);


firstButton.addEventListener(
  "click",
  () => {

    flashButton(firstButton);

    goToFirst();

  }
);


lastButton.addEventListener(
  "click",
  () => {

    flashButton(lastButton);

    goToLast();

  }
);


resetButton.addEventListener(
  "click",
  () => {

    flashButton(resetButton);

    resetNumbers();

  }
);


// ======================================
// キーボード操作
// ======================================

document.addEventListener(
  "keydown",
  (event) => {

    const key =
      event.key.toLowerCase();


    // ================================
    // 次の数字
    // ================================

    if (

      event.key === "Enter" ||
      event.key === "ArrowRight" ||
      event.key === "ArrowUp" ||
      key === "l" ||
      key === "d" ||
      key === "w"

    ) {

      event.preventDefault();

      flashButton(nextButton);

      nextNumber();

      return;

    }


    // ================================
    // 前の数字
    // ================================

    if (

      event.key === "Backspace" ||
      event.key === "ArrowLeft" ||
      event.key === "ArrowDown" ||
      key === "a" ||
      key === "s" ||
      key === "j"

    ) {

      event.preventDefault();

      flashButton(prevButton);

      previousNumber();

      return;

    }


    // ================================
    // 自動表示
    // ================================

    if (

      event.key === " " ||
      key === "k" ||
      key === "q"

    ) {

      event.preventDefault();

      flashButton(autoButton);

      toggleAuto();

      return;

    }


    // ================================
    // 最初
    // ================================

    if (event.key === "1") {

      event.preventDefault();

      flashButton(firstButton);

      goToFirst();

      return;

    }


    // ================================
    // 最後
    // ================================

    if (event.key === "9") {

      event.preventDefault();

      flashButton(lastButton);

      goToLast();

      return;

    }


    // ================================
    // リセット
    // ================================

    if (event.key === "0") {

      event.preventDefault();

      flashButton(resetButton);

      resetNumbers();

      return;

    }

  }
);


// ======================================
// 初期化
// ======================================

createRandomNumbers();

displayNumber();


</script>

</body>
</html>
