name: Move PC number up 1cm

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move displayed number up
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'transform:translateY(clamp(24px,4vh,48px))'
          new = 'transform:translateY(calc(clamp(24px,4vh,48px) - 38px))'
          if old not in text:
              raise SystemExit('target CSS not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/pc-number-up-v1.yml
          git commit -m 'PC版の表示中数字を1cm上へ移動'
          git push
