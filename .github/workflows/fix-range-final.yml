name: Fix deferred range behavior

on:
  push:
    paths:
      - '.github/workflows/fix-range-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch range behavior
        shell: python
        run: |
          import re
          from pathlib import Path

          block = r'''// RANGE_DEFERRED_APPLY_FINAL_V4
          let pendingRangeApply=false;
          function markPendingRangeFinal(){
            if(rangeMode!==2)return false;
            let value=rangeTyping?rangeBuffer:maxInput.value;
            let norm=typeof normalizeDigits==='function'?normalizeDigits(value):typeof normalize==='function'?normalize(value):value;
            let n=Number(norm);
            if(!Number.isInteger(n)||n<0||n>9999){
              rangeInfo.textContent='最大値は0000〜9999';
              rangeInfo.classList.add('error');
              return false
            }
            maxInput.value=n;
            pendingRangeApply=true;
            rangeMode=0;rangeBuffer='';rangeTyping=false;
            minInput.readOnly=false;maxInput.readOnly=false;
            minInput.classList.remove('range-active');maxInput.classList.remove('range-active');
            minInput.blur();maxInput.blur();
            rangeInfo.textContent=`範囲設定完了：${fmt(Number(minInput.value))} 〜 ${fmt(n)} ／ 0キーまたはリセットで適用`;
            rangeInfo.classList.remove('error');
            return true;
          }
          function applyPendingRangeFinal(){
            if(!pendingRangeApply)return false;
            pendingRangeApply=false;
            return applyRange();
          }
          document.addEventListener('keydown',e=>{
            if(pendingRangeApply&&e.key==='0'){
              e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
              applyPendingRangeFinal();
              return;
            }
            if(rangeMode===2&&e.key==='Enter'){
              if(markPendingRangeFinal()){
                e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
              }
            }
          },true);
          document.addEventListener('pointerdown',e=>{
            if(rangeMode!==2)return;
            if(e.target.closest('input,button,select'))return;
            if(markPendingRangeFinal()){
              e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
            }
          },true);
          resetBtn.addEventListener('click',e=>{
            if(!pendingRangeApply)return;
            e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
            flash(resetBtn);
            applyPendingRangeFinal();
          },true);
          reset.addEventListener('click',e=>{
            if(!pendingRangeApply)return;
            e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
            flash(reset);
            applyPendingRangeFinal();
          },true);
          // RANGE_DEFERRED_APPLY_FINAL_V4_END'''

          for name in ('index.html','mobile.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'\s*// RANGE_DEFERRED_APPLY_FIX_V\d+.*?// RANGE_DEFERRED_APPLY_FIX_V\d+_END\s*', '\n', s, flags=re.S)
              s=re.sub(r'\s*// RANGE_DEFERRED_APPLY_FINAL_V\d+.*?// RANGE_DEFERRED_APPLY_FINAL_V\d+_END\s*', '\n', s, flags=re.S)
              # Remove any earlier deferred-range marker variants left by previous patch attempts.
              s=re.sub(r'\s*// RANGE_DEFERRED_APPLY[^\n]*\n.*?// RANGE_DEFERRED_APPLY[^\n]*_END\s*', '\n', s, flags=re.S)
              if '</script>' not in s:
                  raise SystemExit(f'no script tag in {name}')
              s=s.replace('</script>', block+'\n</script>', 1)
              p.write_text(s,encoding='utf-8')

      - name: Commit site files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mobile.html
          if git diff --cached --quiet; then
            echo 'No site changes to commit.'
          else
            git commit -m '最大値確定後は0キーまたはリセットまで範囲適用を待機'
            git push
          fi

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-range-final.yml || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '一時修正ワークフローを削除'
          git push
