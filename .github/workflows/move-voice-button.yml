name: Move voice button

on:
  push:
    paths:
      - '.github/workflows/move-voice-button.yml'

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move voice toggle next to reset
        run: |
          python - <<'PY'
          from pathlib import Path

          def move_pc(path):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              old = '<div class="voice-controls"><button id="voiceToggle" class="voice-toggle" type="button">🔇 音声読み上げ：OFF</button><select id="voiceSelect" class="voice-select" aria-label="読み上げ音声"></select></div>'
              new = '<div class="voice-controls"><select id="voiceSelect" class="voice-select" aria-label="読み上げ音声"></select></div>'
              if old in s and '<button id="voiceToggle"' not in s[s.index('</div>\n</main>'):]:
                  s = s.replace(old, new, 1)
                  marker = '<button id="resetButton" type="button"><span class="main-text">リセット</span><span class="key-text">0キー</span></button>'
                  voice = '<button id="voiceToggle" class="voice-toggle" type="button">🔇 音声読み上げ：OFF</button>'
                  s = s.replace(marker, marker + voice, 1)
                  p.write_text(s, encoding='utf-8')

          def move_mobile(path):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              old = '<div class="voice"><button id="voiceToggle" type="button">🔇 音声読み上げ：OFF</button><select id="voiceSelect" aria-label="読み上げ音声"></select></div>'
              new = '<div class="voice"><select id="voiceSelect" aria-label="読み上げ音声"></select></div>'
              if old in s:
                  s = s.replace(old, new, 1)
                  marker = '<button id="reset" class="reset">リセット</button>'
                  voice = '<button id="voiceToggle" class="voice-toggle" type="button">🔇 音声読み上げ：OFF</button>'
                  s = s.replace(marker, marker + voice, 1)
                  p.write_text(s, encoding='utf-8')

          move_pc('index.html')
          move_mobile('mobile.html')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "音声ボタンをリセットの隣へ移動"
          git push

# rerun