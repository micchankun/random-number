name: Fix touch range input

on:
  push:
    paths:
      - '.github/workflows/move-voice-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site
        run: |
          python - <<'PY'
          from pathlib import Path
          marker_start='// RANGE_INPUT_TAP_KEYBOARD_V6'
          marker_end='// RANGE_INPUT_TAP_KEYBOARD_V6_END'
          for name in ('index.html','mobile.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              for old in ('V4','V5'):
                  a_marker=f'// RANGE_INPUT_TAP_KEYBOARD_{old}'
                  b_marker=f'// RANGE_INPUT_TAP_KEYBOARD_{old}_END'
                  while a_marker in s:
                      a=s.find(a_marker)
                      b=s.find(b_marker,a)
                      if b < 0: raise SystemExit('marker end not found in '+name)
                      b=s.find('\n',b)
                      s=s[:a]+(s[b+1:] if b>=0 else '')
              while marker_start in s:
                  a=s.find(marker_start)
                  b=s.find(marker_end,a)
                  if b < 0: raise SystemExit('marker end not found in '+name)
                  b=s.find('\n',b)
                  s=s[:a]+(s[b+1:] if b>=0 else '')
              marker=f'''{marker_start}
          [minInput,maxInput].forEach(input=>input.addEventListener('pointerdown',e=>{{e.stopPropagation();let mode=input===minInput?1:2;if(rangeMode===0){{if(typeof startRange==='function')startRange();else if(typeof startRangeMode==='function')startRangeMode()}}rangeMode=mode;rangeBuffer='';rangeTyping=false;minInput.readOnly=mode!==1;maxInput.readOnly=mode!==2;minInput.classList.toggle('range-active',mode===1);maxInput.classList.toggle('range-active',mode===2);rangeInfo.classList.remove('range-error');rangeInfo.textContent=mode===1?'最小値を入力 → Enterで決定':'最大値を入力 → Enterで決定';input.setAttribute('inputmode','numeric');input.focus();input.select()}}));
          {marker_end}
          '''
              s=s.replace('</script>',marker+'</script>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile.html
          git diff --cached --quiet && exit 0
          git commit -m "範囲入力タップ時のキーボードと二重入力を修正"
          git push
