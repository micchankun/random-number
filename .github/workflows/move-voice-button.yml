name: Fix touch range input

on:
  push:
    paths:
      - '.github/workflows/move-voice-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site
        run: |
          python - <<'PY'
          from pathlib import Path
          marker = "// RANGE_INPUT_TAP_START_V2\n[minInput,maxInput].forEach(input=>input.addEventListener('pointerdown',e=>{if(!rangeMode){e.preventDefault();startRangeMode()}}));\n// RANGE_INPUT_TAP_START_V2_END\n"
          for name in ('index.html','mobile.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if 'function startRangeMode()' not in s:
                  raise SystemExit('startRangeMode not found in '+name)
              a=s.find('// RANGE_INPUT_TAP_START_V')
              if a>=0:
                  b=s.find('// RANGE_INPUT_TAP_START_V',a+1)
                  end=s.find('\n',b)
                  if b>=0:
                      b2=s.find('\n',b)+1
                      s=s[:a]+s[b2:]
              s=s.replace('</script>',marker+'</script>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile.html
          git diff --cached --quiet && exit 0
          git commit -m "最小値と最大値の入力欄タップで範囲選択を開始"
          git push
