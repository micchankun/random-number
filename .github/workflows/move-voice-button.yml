name: Remove local Yukkuri voice and fix range selection focus

on:
  push:
    paths:
      - '.github/workflows/move-voice-button.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix range selection input behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          FOCUS_FIX = r'''// RANGE_BUTTON_FOCUS_FIX_V1
          rangeButton.addEventListener('click',()=>{
              setTimeout(()=>{
                  if(rangeMode){
                      minInput.focus();
                      minInput.select();
                  }
              },0);
          });
          // RANGE_BUTTON_FOCUS_FIX_V1_END
          '''

          BLANK_TAP_FIX = r'''// RANGE_BLANK_TAP_CONFIRM_V2
          document.addEventListener('pointerdown',e=>{
              if(!rangeMode)return;
              if(e.target.closest('input,button,select'))return;
              document.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',code:'Enter',bubbles:true}));
          });
          // RANGE_BLANK_TAP_CONFIRM_V2_END
          '''

          def cleanup(path):
              p = Path(path)
              s = p.read_text(encoding='utf-8')

              # Remove abandoned local Yukkuri voice UI/code if present.
              s = re.sub(r'// YUKKURI_LOCAL_VOICE_V1.*?// YUKKURI_LOCAL_VOICE_V1_END\s*', '', s, flags=re.S)

              # Range selection must allow the mobile browser to open the numeric keyboard.
              s = s.replace('minInput.readOnly=true;maxInput.readOnly=true;', 'minInput.readOnly=false;maxInput.readOnly=false;')

              # Replace the range-selection state machine with the requested behavior.
              pattern = r'function startRange\(\)\{.*?\nrangeButton\.onclick='
              replacement = r'''function startRange(){stopAuto();rangeMode=1;rangeBuffer='';rangeTyping=false;minInput.value=minNumber;maxInput.value=maxNumber;minInput.readOnly=false;maxInput.readOnly=false;setFocus(1);setTimeout(()=>minInput.select(),0);rangeInfo.textContent='最小値を入力して決定 → 最大値';rangeInfo.classList.remove('error')}
          function rangeKey(e){if(!rangeMode)return false;let digit=normalize(e.key);if(/^[0-9]$/.test(digit)){e.preventDefault();let input=rangeMode===1?minInput:maxInput;if(!rangeTyping){rangeBuffer='';rangeTyping=true;input.value=''}if(rangeBuffer.length<4){rangeBuffer+=digit;input.value=rangeBuffer}return true}if(e.key==='Backspace'){e.preventDefault();let input=rangeMode===1?minInput:maxInput;if(!rangeTyping){rangeBuffer=normalize(input.value)}if(rangeBuffer.length){rangeBuffer=rangeBuffer.slice(0,-1);input.value=rangeBuffer;rangeTyping=true}return true}if(e.key==='Enter'){e.preventDefault();let input=rangeMode===1?minInput:maxInput;let value=rangeTyping?rangeBuffer:normalize(input.value);let n=Number(value);if(rangeMode===1){if(!Number.isInteger(n)||n<0||n>9999){rangeInfo.textContent='最小値は0000〜9999';rangeInfo.classList.add('error');return true}minInput.value=n;rangeMode=2;rangeBuffer='';rangeTyping=false;setFocus(2);setTimeout(()=>maxInput.select(),0);rangeInfo.textContent='最大値を入力して決定';return true}if(!applyRange())return true;cancelRange();return true}if(e.key==='Escape'){e.preventDefault();cancelRange();return true}e.preventDefault();return true}
          rangeButton.onclick='''
              m = re.search(pattern, s, flags=re.S)
              if not m:
                  raise SystemExit(f'Range function block not found in {path}')
              s = s[:m.start()] + replacement + s[m.end():]

              # Remove old blank-tap marker and append the current one once.
              s = re.sub(r'// RANGE_BLANK_TAP_CONFIRM_V1.*?// RANGE_BLANK_TAP_CONFIRM_V1_END\s*', '', s, flags=re.S)
              s = re.sub(r'// RANGE_BLANK_TAP_CONFIRM_V2.*?// RANGE_BLANK_TAP_CONFIRM_V2_END\s*', '', s, flags=re.S)
              if 'RANGE_BLANK_TAP_CONFIRM_V2' not in s:
                  s = s.replace('</script>', BLANK_TAP_FIX + '\n</script>', 1)

              # Keep the range-button focus fix present.
              if 'RANGE_BUTTON_FOCUS_FIX_V1' not in s:
                  s = s.replace('</script>', FOCUS_FIX + '\n</script>', 1)

              p.write_text(s,encoding='utf-8')

          cleanup('index.html')
          cleanup('mobile.html')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "範囲選択の入力確定動作を改善"
          git push
