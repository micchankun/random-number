name: Remove local Yukkuri voice

on:
  push:
    paths:
      - '.github/workflows/move-voice-button.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove local Yukkuri voice from site
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def cleanup(path):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              s2 = re.sub(r'// YUKKURI_LOCAL_VOICE_V1.*?// YUKKURI_LOCAL_VOICE_V1_END\s*', '', s, flags=re.S)
              if s2 != s:
                  p.write_text(s2, encoding='utf-8')

          cleanup('index.html')
          cleanup('mobile.html')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "アプリからゆっくり表記を削除"
          git push
