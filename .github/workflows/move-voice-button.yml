name: Fix touch range input

on:
  push:
    paths:
      - '.github/workflows/move-voice-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site
        run: |
          python - <<'PY'
          from pathlib import Path
          marker = "// RANGE_INPUT_TAP_START_V3\n[minInput,maxInput].forEach(input=>input.addEventListener('pointerdown',e=>{if(!rangeMode){e.preventDefault();startRangeMode()}setTimeout(()=>{input.readOnly=false;input.setAttribute('inputmode','numeric');input.focus();input.select()},50)}));\n// RANGE_INPUT_TAP_START_V3_END\n"
          for name in ('index.html','mobile.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if 'function startRangeMode()' not in s:
                  raise SystemExit('startRangeMode not found in '+name)
              # 入力欄タップ用の旧マーカーを除去
              while '// RANGE_INPUT_TAP_START_V' in s:
                  a=s.find('// RANGE_INPUT_TAP_START_V')
                  b=s.find('// RANGE_INPUT_TAP_START_V',a+1)
                  if b < 0:
                      raise SystemExit('range tap marker end not found in '+name)
                  end=s.find('\n',b)
                  if end < 0:
                      end=len(s)
                  s=s[:a]+s[end+1:]
              # 範囲モード開始時にも入力欄を編集可能にし、キーボードを開く
              old="rangeMode=1;rangeBuffer='';rangeTyping=false;minInput.value=minNumber;maxInput.value=maxNumber;minInput.readOnly=true;maxInput.readOnly=true;"
              new="rangeMode=1;rangeBuffer='';rangeTyping=false;minInput.value=minNumber;maxInput.value=maxNumber;minInput.readOnly=false;maxInput.readOnly=false;"
              s=s.replace(old,new,1)
              s=s.replace('</script>',marker+'</script>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile.html
          git diff --cached --quiet && exit 0
          git commit -m "最小値と最大値の入力欄タップでキーボードを表示"
          git push
