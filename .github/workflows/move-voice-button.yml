name: Fix touch range input

on:
  push:
    paths:
      - '.github/workflows/move-voice-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site
        run: |
          python - <<'PY'
          from pathlib import Path
          marker_start='// RANGE_INPUT_TAP_KEYBOARD_V5'
          marker_end='// RANGE_INPUT_TAP_KEYBOARD_V5_END'
          for name in ('index.html','mobile.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              while marker_start in s:
                  a=s.find(marker_start)
                  b=s.find(marker_end,a)
                  if b < 0: raise SystemExit('marker end not found in '+name)
                  b=s.find('\n',b)
                  s=s[:a]+(s[b+1:] if b>=0 else '')
              marker=f'''{marker_start}\n[minInput,maxInput].forEach(input=>input.addEventListener('pointerdown',e=>{{if(rangeMode===0){{e.preventDefault();if(typeof startRange==='function')startRange();else if(typeof startRangeMode==='function')startRangeMode();minInput.readOnly=false;maxInput.readOnly=false;input.setAttribute('inputmode','numeric');input.focus();input.select()}}}}));\n{marker_end}\n'''
              s=s.replace('</script>',marker+'</script>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile.html
          git diff --cached --quiet && exit 0
          git commit -m "入力欄タップで数字キーボードを即時表示"
          git push
