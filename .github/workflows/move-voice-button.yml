name: Move voice controls

on:
  push:
    paths:
      - '.github/workflows/move-voice-button.yml'

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore browser Japanese voice and set default interval to 3 seconds
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          INTERVALS = "const INTERVALS=[['0.1秒',100],['0.2秒',200],['0.3秒',300],['0.4秒',400],['0.5秒',500],['0.6秒',600],['0.7秒',700],['0.8秒',800],['0.9秒',900],['1秒',1000],['1.1秒',1100],['1.2秒',1200],['1.3秒',1300],['1.4秒',1400],['1.5秒',1500],['1.6秒',1600],['1.7秒',1700],['1.8秒',1800],['1.9秒',1900],['2秒',2000],['2.1秒',2100],['2.2秒',2200],['2.3秒',2300],['2.4秒',2400],['2.5秒',2500],['2.6秒',2600],['2.7秒',2700],['2.8秒',2800],['2.9秒',2900],['3秒',3000],['5秒',5000],['10秒',10000],['15秒',15000],['20秒',20000],['30秒',30000],['45秒',45000],['1分',60000],['1分30秒',90000],['2分',120000],['2分30秒',150000],['3分',180000],['3分30秒',210000],['4分',240000],['4分30秒',270000],['5分',300000]];"

          def cleanup_pc(path):
              p = Path(path)
              s = p.read_text(encoding='utf-8')

              s = re.sub(r'<div id="voicevoxCredit">.*?</div>', '', s, count=1, flags=re.S)
              s = re.sub(r'#voicevoxCredit\{[^}]*\}', '', s, count=1)
              s = re.sub(r'intervalIndex=\d+', 'intervalIndex=30', s, count=1)
              s = s.replace(
                  "let minNumber=0,maxNumber=9999,numbers=[],currentIndex=0,autoRunning=false,autoTimer=null,intervalIndex=11,rangeMode=0,rangeBuffer='',rangeTyping=false,voiceEnabled=false,selectedVoice=null,availableVoices=[],voiceMode='browser',voicevoxSpeakerId=3,currentAudio=null;",
                  "let minNumber=0,maxNumber=9999,numbers=[],currentIndex=0,autoRunning=false,autoTimer=null,intervalIndex=30,rangeMode=0,rangeBuffer='',rangeTyping=false,voiceEnabled=false,selectedVoice=null,availableVoices=[];"
              )
              s = re.sub(
                  r"async function speakZundamon\(text\)\{.*?\}\nfunction speakNumber\(\)\{.*?\}\nfunction loadVoices",
                  "function speakNumber(){if(!voiceEnabled||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let text=fmt(numbers[currentIndex]).split('').join(' ');let u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';if(selectedVoice)u.voice=selectedVoice;u.rate=1;u.pitch=1;window.speechSynthesis.speak(u)}\nfunction loadVoices",
                  s, count=1, flags=re.S
              )
              s = re.sub(
                  r"function loadVoices\(\)\{.*?\}\nfunction setVoiceEnabled",
                  "function loadVoices(){if(!('speechSynthesis'in window)){voiceSelect.disabled=true;voiceToggle.disabled=true;voiceToggle.textContent='🔇 音声非対応';return}availableVoices=window.speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('ja'));voiceSelect.innerHTML='';if(!availableVoices.length){let o=document.createElement('option');o.value='';o.textContent='標準音声（ブラウザ）';voiceSelect.appendChild(o);voiceSelect.disabled=true;return}voiceSelect.disabled=false;availableVoices.forEach((v,i)=>{let o=document.createElement('option');o.value=String(i);o.textContent=v.name+'（'+v.lang+'）';voiceSelect.appendChild(o)});let saved=localStorage.getItem('randomNumberVoice');let idx=availableVoices.findIndex(v=>v.voiceURI===saved);if(idx<0)idx=0;voiceSelect.value=String(idx);selectedVoice=availableVoices[idx]}\nfunction setVoiceEnabled",
                  s, count=1, flags=re.S
              )
              s = re.sub(
                  r"function setVoiceEnabled\(enabled\)\{.*?\}\nfunction cycleVoice",
                  "function setVoiceEnabled(enabled){voiceEnabled=enabled;voiceToggle.textContent=enabled?'🔊 音声読み上げ：ON':'🔇 音声読み上げ：OFF';voiceToggle.classList.toggle('on',enabled);if(!enabled&&'speechSynthesis'in window)window.speechSynthesis.cancel()}\nfunction cycleVoice",
                  s, count=1, flags=re.S
              )
              s = re.sub(
                  r"function cycleVoice\(\)\{.*?\}\nfunction displayNumber",
                  "function cycleVoice(){if(!availableVoices.length||voiceSelect.disabled)return;let i=availableVoices.findIndex(v=>v.voiceURI===selectedVoice?.voiceURI);i=(i+1)%availableVoices.length;selectedVoice=availableVoices[i];voiceSelect.value=String(i);localStorage.setItem('randomNumberVoice',selectedVoice.voiceURI);if(voiceEnabled)speakNumber()}\nfunction displayNumber",
                  s, count=1, flags=re.S
              )
              s = re.sub(
                  r"voiceSelect\.onchange=\(\)=>\{.*?\};async function initVoicevox\(\)\{.*?\}\n",
                  "voiceSelect.onchange=()=>{let i=Number(voiceSelect.value);selectedVoice=availableVoices[i]||null;if(selectedVoice)localStorage.setItem('randomNumberVoice',selectedVoice.voiceURI);if(voiceEnabled)speakNumber();restartTimer()};",
                  s, count=1, flags=re.S
              )
              s = re.sub(r"const INTERVALS=\[.*?\];", INTERVALS, s, count=1, flags=re.S)
              p.write_text(s, encoding='utf-8')

          def update_mobile(path):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'intervalIndex=\d+', 'intervalIndex=30', s, count=1)
              s = re.sub(r"const INTERVALS=\[.*?\];", INTERVALS, s, count=1, flags=re.S)
              p.write_text(s, encoding='utf-8')

          cleanup_pc('index.html')
          update_mobile('mobile.html')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "自動表示のデフォルトを3秒に変更"
          git push
