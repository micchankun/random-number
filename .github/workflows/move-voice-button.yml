name: Fix touch range input

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/move-voice-button.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch range input tap behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = '''// RANGE_INPUT_TAP_START_V1
[minInput,maxInput].forEach(input=>{
  input.addEventListener('pointerdown',e=>{
    if(!rangeMode){
      e.preventDefault();
      startRangeMode();
    }
  });
});
// RANGE_INPUT_TAP_START_V1_END
'''

          def patch(path):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              import re
              s=re.sub(r'// RANGE_INPUT_TAP_START_V[0-9]+.*?// RANGE_INPUT_TAP_START_V[0-9]+_END\s*','',s,flags=re.S)
              if 'function startRangeMode()' not in s:
                  raise SystemExit(f'startRangeMode not found: {path}')
              s=s.replace('</script>',marker+'</script>',1)
              p.write_text(s,encoding='utf-8')

          patch('index.html')
          patch('mobile.html')
          PY
      - name: Commit site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile.html
          git diff --cached --quiet && exit 0
          git commit -m "最小値と最大値の入力欄タップで範囲選択を開始"
          git push
