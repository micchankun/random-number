name: Move voice controls

on:
  push:
    paths:
      - '.github/workflows/move-voice-button.yml'

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move voice controls next to reset
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def move_pc(path):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<div class="voice-controls">.*?</div>', '', s, count=1, flags=re.S)
              s = re.sub(r'<button id="voiceToggle"[^>]*>.*?</button>', '', s, count=1, flags=re.S)
              marker = '<button id="resetButton" type="button"><span class="main-text">リセット</span><span class="key-text">0キー</span></button>'
              voice = '<div class="voice-controls"><button id="voiceToggle" class="voice-toggle" type="button">🔇 音声読み上げ：OFF</button><select id="voiceSelect" class="voice-select" aria-label="読み上げ音声"></select></div>'
              if marker in s:
                  s = s.replace(marker, marker + voice, 1)
              p.write_text(s, encoding='utf-8')

          def move_mobile(path):
              p = Path(path)
              s = re.sub(r'<div class="voice">.*?</div>', '', p.read_text(encoding='utf-8'), count=1, flags=re.S)
              s = re.sub(r'<button id="voiceToggle"[^>]*>.*?</button>', '', s, count=1, flags=re.S)
              marker = '<button id="reset" class="reset">リセット</button>'
              voice = '<div class="voice"><button id="voiceToggle" class="voice-toggle" type="button">🔇 音声読み上げ：OFF</button><select id="voiceSelect" aria-label="読み上げ音声"></select></div>'
              if marker in s:
                  s = s.replace(marker, marker + voice, 1)
              p.write_text(s, encoding='utf-8')

          move_pc('index.html')
          move_mobile('mobile.html')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "音声ボタンと声変更をリセットの隣へ配置"
          git push
