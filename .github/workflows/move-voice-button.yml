name: Apply reset auto-stop fix

on:
  push:
    paths:
      - '.github/workflows/move-voice-button.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reset behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function resetNumbers(){clearTemporaryNotice();const d=pendingDiff();if(d.p.count===0){createRandomNumbers();displayNumber();restartTimer();return}applySettings()}"
          new = "function resetNumbers(){clearTemporaryNotice();autoRunning=false;if(autoTimer)clearTimeout(autoTimer);autoTimer=null;const d=pendingDiff();if(d.p.count===0){createRandomNumbers();displayNumber();return}applySettings()}"
          if old not in s:
              raise SystemExit('resetNumbers target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit site fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/move-voice-button.yml
          git commit -m "リセット時は自動表示を停止"
          git push
