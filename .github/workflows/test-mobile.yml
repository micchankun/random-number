name: Mobile test
on: push
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- MOBILE_RANGE_INPUT_HOTFIX_V1 -->'
          if marker in s:
              raise SystemExit(0)
          patch='''
<!-- MOBILE_RANGE_INPUT_HOTFIX_V1 -->
<script>
(()=>{
  const inputs=[document.getElementById('minInput'),document.getElementById('maxInput')].filter(Boolean);
  for(const input of inputs){
    input.addEventListener('pointerdown',e=>{
      e.stopImmediatePropagation();
      requestAnimationFrame(()=>{
        input.focus({preventScroll:true});
        try{input.setSelectionRange(input.value.length,input.value.length)}catch(_){}
      });
    },true);
    input.addEventListener('beforeinput',e=>{
      if(e.inputType==='insertText'||e.inputType==='insertCompositionText'||e.inputType==='insertFromPaste'){
        const data=(e.data??'').replace(/\D/g,'');
        e.preventDefault();
        e.stopImmediatePropagation();
        if(!data)return;
        const old=input.value.replace(/\D/g,'');
        const start=input.selectionStart??old.length;
        const end=input.selectionEnd??old.length;
        input.value=(old.slice(0,start)+data+old.slice(end)).slice(0,4);
        input.dispatchEvent(new Event('input',{bubbles:true}));
        return;
      }
      if(e.inputType==='deleteContentBackward'||e.inputType==='deleteContentForward'){
        e.preventDefault();
        e.stopImmediatePropagation();
        const old=input.value;
        if(e.inputType==='deleteContentBackward'){
          const pos=input.selectionStart??old.length;
          if(pos>0) input.value=old.slice(0,pos-1)+old.slice(input.selectionEnd??pos);
        }else{
          const pos=input.selectionStart??old.length;
          input.value=old.slice(0,pos)+old.slice(input.selectionEnd??pos+1);
        }
        input.dispatchEvent(new Event('input',{bubbles:true}));
      }
    },true);
    input.addEventListener('keydown',e=>{
      if(/^\d$/.test(e.key)||e.key==='Backspace'||e.key==='Delete') e.stopImmediatePropagation();
    },true);
  }
})();
</script>
'''
          p.write_text(s.replace('</body>',patch+'</body>'),encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix mobile range input keyboard and duplicate digits'
          git push
