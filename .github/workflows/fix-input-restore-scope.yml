name: Fix input restore scope

on:
  push:
    paths:
      - '.github/workflows/fix-input-restore-scope.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch shared range restore state
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace("  const rememberRangeOriginal=input=>{\n    if(input===minInput)rangeOriginalMin=minInput.value;\n    if(input===maxInput)rangeOriginalMax=maxInput.value;\n  };", "  const rememberRangeOriginal=input=>{\n    if(input===minInput)rangeOriginalMin=minInput.value;\n    if(input===maxInput)rangeOriginalMax=maxInput.value;\n  };\n  window.__randomNumberRememberRangeOriginal=rememberRangeOriginal;", 1)

          s=s.replace("function startRangeMode(){rangeMode=1;rangeBuffer='';rangeTyping=false;minInput.readOnly=false;", "function startRangeMode(){window.__randomNumberRememberRangeOriginal?.(minInput);window.__randomNumberRememberRangeOriginal?.(maxInput);rangeMode=1;rangeBuffer='';rangeTyping=false;minInput.readOnly=false;", 1)

          s=s.replace("if(rangeMode===0)startRangeMode();rememberRangeOriginal(input);rangeMode=mode;", "if(rangeMode===0)startRangeMode();window.__randomNumberRememberRangeOriginal?.(input);rangeMode=mode;", 1)

          s=s.replace("rangeMode=2;rangeBuffer='';rangeTyping=false;\n      rememberRangeOriginal(maxInput);", "rangeMode=2;rangeBuffer='';rangeTyping=false;\n      window.__randomNumberRememberRangeOriginal?.(maxInput);", 1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-input-restore-scope.yml
          git commit -m "入力欄の復元情報を全端末共通で保持"
          git push
