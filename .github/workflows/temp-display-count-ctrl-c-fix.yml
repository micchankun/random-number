name: temp-display-count-ctrl-c-fix
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '表示回数入力のCtrl+C認識を修正 完了') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Ctrl+C handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "if(k==='c'||k==='C'||k==='ｃ'||k==='Ｃ'||e.code==='KeyC'){"
          new = "if(!e.ctrlKey&&(k==='c'||k==='C'||k==='ｃ'||k==='Ｃ'||e.code==='KeyC')){"
          if old not in s:
              raise SystemExit('target code not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Patched Ctrl+C handling in display-count keyboard shortcut')
          PY
      - name: Verify patch
        run: |
          grep -F "if(!e.ctrlKey&&(k==='c'||k==='C'||k==='ｃ'||k==='Ｃ'||e.code==='KeyC')){" index.html
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "表示回数入力のCtrl+C認識を修正 完了"
          git rm .github/workflows/temp-display-count-ctrl-c-fix.yml
          git commit -m "表示回数入力のCtrl+C修正用ワークフローを削除"
          git push
