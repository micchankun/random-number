name: Mobile range input final fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- MOBILE_RANGE_INPUT_FIX_V2 -->'
          if marker in s:
              print('Final mobile input fix already present')
              raise SystemExit(0)
          patch = r'''
<!-- MOBILE_RANGE_INPUT_FIX_V2 -->
<script>
(()=>{
  const ids=['minInput','maxInput'];
  const isRangeInput=t=>t && ids.includes(t.id);

  // Stop the older document-level keyboard handlers before they can modify
  // the input value. The browser then performs the normal native edit once.
  window.addEventListener('keydown',e=>{
    if(!isRangeInput(e.target)) return;
    if(/^\d$/.test(e.key)||e.key==='Backspace'||e.key==='Delete'){
      e.stopPropagation();
    }
  },true);

  // Likewise, bypass the older custom beforeinput handler so mobile keyboards
  // use the browser's native insertion exactly once.
  window.addEventListener('beforeinput',e=>{
    if(isRangeInput(e.target)) e.stopPropagation();
  },true);

  // Focus the tapped range field before the old document pointer handler runs,
  // allowing mobile browsers to open the numeric keyboard normally.
  window.addEventListener('pointerdown',e=>{
    const input=e.target && e.target.closest ? e.target.closest('#minInput,#maxInput') : null;
    if(!input) return;
    e.stopPropagation();
    input.focus({preventScroll:true});
    try{
      const p=input.value.length;
      input.setSelectionRange(p,p);
    }catch(_){ }
  },true);
})();
</script>
'''
          s = s.replace('</body>', patch + '</body>')
          p.write_text(s, encoding='utf-8')
          print('Applied final mobile range input fix')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix mobile range input focus and duplicate digits'
          git push
