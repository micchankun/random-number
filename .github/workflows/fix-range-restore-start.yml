name: Fix range restore start

on:
  push:
    paths:
      - '.github/workflows/fix-range-restore-start.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix range restore start state
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function startRangeMode(){rangeOriginalMin=minInput.value;rangeOriginalMax=maxInput.value;rangeMode=1;rangeBuffer='';rangeTyping=false;minInput.readOnly=false;"
          new="function startRangeMode(){window.__randomNumberRememberRangeOriginal?.(minInput);window.__randomNumberRememberRangeOriginal?.(maxInput);rangeMode=1;rangeBuffer='';rangeTyping=false;minInput.readOnly=false;"
          if old not in s: raise SystemExit('startRangeMode target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-range-restore-start.yml
          git commit -m "範囲選択開始時の復元情報参照を修正"
          git push
