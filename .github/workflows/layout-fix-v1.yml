name: Apply layout fix v1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch layout CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '/* LAYOUT_FIX_V1 */'
          if marker in text:
              raise SystemExit('layout fix already applied')

          css = r'''\n/* LAYOUT_FIX_V1 */\nhtml,body{min-height:100%;height:auto}\nbody{min-height:100dvh;overflow-x:hidden;overflow-y:auto;align-items:flex-start}\n.container{height:auto;min-height:100dvh;padding:clamp(12px,2vw,24px);justify-content:flex-start;gap:clamp(8px,1.15vh,14px);overflow:visible}\n#number{flex-shrink:0;margin:clamp(4px,1.5vh,14px) 0 0}\n.range-controls,.voice-controls,.duplicate-controls,.display-count-controls,.settings-notice{width:min(760px,100%)}\n.range-controls{flex-wrap:wrap}\n.previous-wrap{width:min(760px,100%);flex:0 0 clamp(86px,18vh,190px);overflow:visible}\n#previousNumbers{min-height:0;height:100%}\n.buttons{width:min(760px,100%);flex-shrink:0}\n.buttons button{min-width:0}\n.key-text{overflow-wrap:anywhere}\n#resetButton{grid-column:1/-1}\n\n@media(max-width:900px){\n  .history-panel{width:100%;height:100%;position:static}\n  .previous-wrap{display:block}\n  .history-panel #previousNumbers{height:calc(100% - 42px)}\n  .history-panel.collapsed{height:42px}\n}\n\n@media(max-width:600px){\n  .container{padding:10px 8px 14px;gap:7px}\n  #number{font-size:clamp(50px,17vw,110px);margin-top:0}\n  .range-controls{display:grid;grid-template-columns:auto minmax(64px,1fr) auto auto minmax(64px,1fr);gap:6px}\n  .range-controls .range-label{align-self:center}\n  .range-controls .range-button{grid-column:1/-1;width:100%;margin-top:1px}\n  .range-input{width:100%;min-width:0}\n  .range-button{width:auto;min-width:0}\n  .voice-controls{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}\n  .duplicate-controls{grid-template-columns:auto minmax(0,1fr)}\n  .display-count-controls{display:grid;grid-template-columns:auto minmax(68px,90px) minmax(0,1fr);gap:6px}\n  .display-count-input{width:100%!important}\n  .previous-wrap{flex-basis:100px}\n  .buttons{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}\n  #autoButton,#resetButton,.interval-controls{grid-column:1/-1}\n  .buttons button,.interval-controls button,.voice-controls button,.voice-controls select,.duplicate-controls select{height:auto;min-height:50px}\n  .main-text{font-size:clamp(14px,4vw,19px)}\n  .key-text{font-size:8px;line-height:1.15}\n  .interval-menu{left:2%;right:2%;max-height:44vh}\n}\n\n@media(max-height:600px){\n  .container{padding-top:7px;padding-bottom:10px;gap:5px}\n  #number{font-size:clamp(42px,14vh,105px)}\n  .previous-wrap{flex-basis:72px}\n  .buttons button,.interval-controls button,.voice-controls button,.voice-controls select,.duplicate-controls select{min-height:42px;height:auto}\n}\n\n@media(max-height:450px){\n  .container{padding-top:5px;padding-bottom:8px;gap:4px}\n  #number{font-size:clamp(38px,13vh,88px)}\n  .previous-wrap{flex-basis:58px}\n  .buttons button,.interval-controls button,.voice-controls button,.voice-controls select,.duplicate-controls select{min-height:38px}\n}\n'''

          needle = '\n</style>'
          if needle not in text:
              raise SystemExit('style closing tag not found')
          text = text.replace(needle, css + needle, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit layout fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/layout-fix-v1.yml
          git commit -m '画面の見切れを防ぐレスポンシブレイアウトに修正'
          git push