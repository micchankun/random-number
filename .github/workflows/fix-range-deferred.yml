name: Fix deferred range apply

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch range behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          patch = r'''// RANGE_DEFERRED_APPLY_FIX_V2
          function finishPendingRangeV2(){
            if(rangeMode!==3)return false;
            if(!applyRange())return false;
            if(typeof cancelRange==='function')cancelRange();
            else if(typeof cancelRangeMode==='function')cancelRangeMode();
            return true;
          }
          function markPendingRangeV2(){
            if(rangeMode!==2)return false;
            let value=rangeTyping?rangeBuffer:maxInput.value;
            let n=Number((typeof normalizeDigits==='function'?normalizeDigits(value):typeof normalize==='function'?normalize(value):value));
            if(!Number.isInteger(n)||n<0||n>9999)return false;
            maxInput.value=n;
            rangeMode=3;rangeBuffer='';rangeTyping=false;
            minInput.readOnly=true;maxInput.readOnly=true;
            minInput.classList.remove('range-active');maxInput.classList.remove('range-active');
            minInput.blur();maxInput.blur();
            rangeInfo.textContent=`範囲設定完了：${fmt(Number(minInput.value))} 〜 ${fmt(n)} ／ 0キーで適用`;
            rangeInfo.classList.remove('error');
            return true;
          }
          document.addEventListener('keydown',e=>{
            if(rangeMode===3&&e.key==='0'){
              e.preventDefault();e.stopImmediatePropagation();finishPendingRangeV2();return;
            }
            if(rangeMode===2&&e.key==='Enter'){
              if(markPendingRangeV2()){e.preventDefault();e.stopImmediatePropagation();}
              return;
            }
          },true);
          document.addEventListener('pointerdown',e=>{
            if(rangeMode!==2)return;
            if(e.target.closest('input,button,select'))return;
            if(markPendingRangeV2()){e.preventDefault();e.stopImmediatePropagation();}
          },true);
          [rangeButton,resetBtn||reset].filter(Boolean).forEach(b=>b.addEventListener('click',()=>{
            if(rangeMode===3)setTimeout(finishPendingRangeV2,0);
          }));
          // RANGE_DEFERRED_APPLY_FIX_V2_END
          '''

          for name in ('index.html','mobile.html'):
              p=Path(name);s=p.read_text(encoding='utf-8')
              start='// RANGE_DEFERRED_APPLY_FIX_V2'
              end='// RANGE_DEFERRED_APPLY_FIX_V2_END'
              if start in s:
                  a=s.find(start);b=s.find(end,a)
                  if b>=0:
                      b=s.find('\n',b)
                      s=s[:a]+(s[b+1:] if b>=0 else '')
              pos=s.rfind('</script>')
              if pos<0: raise SystemExit(f'{name}: script end not found')
              s=s[:pos]+patch+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile.html
          git diff --cached --quiet && exit 0
          git commit -m "最大値確定時に範囲を自動適用しないよう修正"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-range-deferred.yml
          git commit -m "一時的な範囲修正ワークフローを削除"
          git push
