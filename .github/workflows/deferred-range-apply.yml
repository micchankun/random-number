name: Deferred range apply

on:
  push:
    paths:
      - '.github/workflows/deferred-range-apply.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch range behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [Path('index.html'), Path('mobile.html')]

          for path in files:
              s = path.read_text(encoding='utf-8')
              original = s

              # After the maximum value is confirmed, enter a pending state.
              # The new range is not applied until the 0 key / reset button is pressed.
              if 'function finishRangeInput' in s:
                  pattern = r"function finishRangeInput\(value,mode\)\{.*?\}\nfunction handleRangeKey"
                  repl = """function finishRangeInput(value,mode){let v=normalizeDigits(value).replace(/\\D/g,'');if(v==='')return false;let n=Number(v);if(!Number.isInteger(n)||n<0||n>9999){rangeInfo.textContent='0000〜9999で入力してください';rangeInfo.classList.add('range-error');return false}if(mode===1){minInput.value=n;rangeMode=2;rangeBuffer='';rangeTyping=false;setRangeInputFocus(2);rangeInfo.textContent='最大値を入力 → Enterで決定';return true}maxInput.value=n;rangeMode=3;rangeBuffer='';rangeTyping=false;minInput.readOnly=true;maxInput.readOnly=true;minInput.classList.remove('range-active');maxInput.classList.remove('range-active');minInput.blur();maxInput.blur();rangeInfo.textContent=`範囲設定完了：${fmt(Number(minInput.value))} 〜 ${fmt(Number(maxInput.value))} ／ 0キーで適用`;rangeInfo.classList.remove('range-error');return true}\nfunction handleRangeKey"""
                  s2, n = re.subn(pattern, repl, s, flags=re.S)
                  if n != 1:
                      raise SystemExit(f'{path}: finishRangeInput replacement count={n}')
                  s = s2

              if 'function rangeKey' in s:
                  pattern = r"function rangeKey\(e\)\{.*?\}\nrangeButton\.onclick"
                  repl = """function rangeKey(e){if(!rangeMode)return false;let digit=normalize(e.key);if(rangeMode===3){e.preventDefault();return true}if(/^[0-9]$/.test(digit)){e.preventDefault();let input=rangeMode===1?minInput:maxInput;if(!rangeTyping){rangeBuffer='';rangeTyping=true;input.value=''}if(rangeBuffer.length<4){rangeBuffer+=digit;input.value=rangeBuffer}return true}if(e.key==='Backspace'){e.preventDefault();if(rangeTyping){rangeBuffer=rangeBuffer.slice(0,-1);(rangeMode===1?minInput:maxInput).value=rangeBuffer}return true}if(e.key==='Enter'){e.preventDefault();let input=rangeMode===1?minInput:maxInput;let value=rangeTyping?rangeBuffer:input.value;if(rangeMode===1){let n=Number(normalize(value));if(!Number.isInteger(n)||n<0||n>9999){rangeInfo.textContent='最小値は0000〜9999';rangeInfo.classList.add('range-error');return true}minInput.value=n;rangeMode=2;rangeBuffer='';rangeTyping=false;setFocus(2);rangeInfo.textContent='最大値を入力して決定';return true}let n=Number(normalize(value));if(!Number.isInteger(n)||n<0||n>9999){rangeInfo.textContent='最大値は0000〜9999';rangeInfo.classList.add('range-error');return true}maxInput.value=n;rangeMode=3;rangeBuffer='';rangeTyping=false;minInput.readOnly=true;maxInput.readOnly=true;minInput.classList.remove('range-active');maxInput.classList.remove('range-active');minInput.blur();maxInput.blur();rangeInfo.textContent=`範囲設定完了：${fmt(Number(minInput.value))} 〜 ${fmt(Number(maxInput.value))} ／ 0キーで適用`;rangeInfo.classList.remove('range-error');return true}if(e.key==='Escape'){e.preventDefault();cancelRange();return true}e.preventDefault();return true}\nrangeButton.onclick"""
                  s2, n = re.subn(pattern, repl, s, flags=re.S)
                  if n != 1:
                      raise SystemExit(f'{path}: rangeKey replacement count={n}')
                  s = s2

              # PC/tablet reset button: apply a pending range when rangeMode===3.
              if 'resetBtn.onclick=' in s:
                  s = s.replace(
                      "resetBtn.onclick=()=>{if(rangeMode)return;flash(resetBtn);shuffle();render()};",
                      "resetBtn.onclick=()=>{if(rangeMode===3){flash(resetBtn);if(applyRange())cancelRange();return}if(rangeMode)return;flash(resetBtn);shuffle();render()};"
                  )
              if 'reset.onclick=' in s:
                  s = s.replace(
                      "reset.onclick=()=>{if(rangeMode)return;flash(reset);resetNumbers()};",
                      "reset.onclick=()=>{if(rangeMode===3){if(applyRange())cancelRangeMode();return}if(rangeMode)return;flash(reset);resetNumbers()};"
                  )

              # Keyboard 0: same pending-range behavior as the reset button.
              if "if(k==='0')" in s:
                  s = s.replace(
                      "if(k==='0'){e.preventDefault();flash(resetBtn);resetNumbers();return}",
                      "if(k==='0'){e.preventDefault();flash(resetBtn);if(rangeMode===3){if(applyRange())cancelRange();return}if(rangeMode)return;resetNumbers();return}"
                  )
              if "if(k==='0')" in s and "if(rangeMode===3){if(applyRange())cancelRangeMode();return}" not in s:
                  s = s.replace(
                      "if(k==='0'){e.preventDefault();flash(reset);resetNumbers();return}",
                      "if(k==='0'){e.preventDefault();flash(reset);if(rangeMode===3){if(applyRange())cancelRangeMode();return}if(rangeMode)return;resetNumbers();return}"
                  )

              # Mobile blank-area Enter is allowed to finalize the maximum into pending state;
              # it must not apply the range until 0 is pressed.
              if 'RANGE_BLANK_TAP_CONFIRM_V1' in s:
                  pass

              if s == original:
                  raise SystemExit(f'{path}: no changes made')
              path.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mobile.html
          git diff --cached --quiet && exit 0
          git commit -m '数字範囲選択を0キー適用方式に変更'
          git push