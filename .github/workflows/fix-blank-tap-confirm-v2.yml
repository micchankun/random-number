name: Fix blank tap range confirmation v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch blank tap handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="document.addEventListener('pointerdown',e=>{if(!rangeMode)return;if(e.target.closest('input,button,select'))return;const input=rangeMode===1?minInput:maxInput;finishRangeInput(input.value,rangeMode);});"
          new="""(()=>{
            let blankTapHandled=false;
            const confirmBlank=()=>{
              if(!rangeMode)return;
              const input=rangeMode===1?minInput:maxInput;
              finishRangeInput(input.value,rangeMode);
            };
            document.addEventListener('pointerup',e=>{
              if(e.target.closest('input,button,select')){blankTapHandled=false;return;}
              if(!rangeMode||blankTapHandled)return;
              blankTapHandled=true;
              confirmBlank();
            },{capture:true});
            document.addEventListener('click',e=>{
              if(e.target.closest('input,button,select')){blankTapHandled=false;return;}
              if(!rangeMode||blankTapHandled)return;
              blankTapHandled=true;
              confirmBlank();
            },{capture:true});
          })();"""
          if old not in s:
              raise SystemExit('blank tap handler not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix blank tap range confirmation reliably"
          git push
