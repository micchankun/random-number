<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ランダム4桁数字表示｜スマホ版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#111827;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;overflow:hidden}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.app{width:100%;height:100dvh;min-height:0;padding:10px;display:flex;flex-direction:column;gap:7px}.number{font:800 clamp(58px,22vw,110px)/.9 "Courier New",monospace;letter-spacing:.04em;text-align:center;text-shadow:0 0 8px rgba(255,255,255,.1),0 0 18px rgba(59,130,246,.12);user-select:none}.position,.status{text-align:center;font-size:12px;font-weight:600;color:#d1d5db;flex:0 0 auto}.range{display:grid;grid-template-columns:auto minmax(58px,1fr) auto minmax(58px,1fr) auto;align-items:center;gap:5px;width:100%;flex:0 0 auto}.range label{font-size:11px;color:#9ca3af;font-weight:700}.range input{width:100%;height:38px;border:1px solid #4b5563;border-radius:8px;background:#f3f4f6;color:#111827;text-align:center;font:700 17px "Courier New",monospace;outline:none;padding:2px}.range input.range-active{outline:2px solid #2563eb;outline-offset:1px}.range button{height:38px;border:0;border-radius:8px;background:#4b5563;color:#fff;font-size:12px;font-weight:700;padding:0 9px}.range-info{min-height:16px;text-align:center;color:#9ca3af;font-size:10px}.error{color:#fca5a5!important}.voice{display:grid;grid-template-columns:1fr 1.5fr;gap:5px;width:100%;flex:0 0 auto}.voice button,.voice select{height:38px;border:0;border-radius:8px;background:#4b5563;color:#fff;font-size:12px;font-weight:700;text-align:center}.voice button.on{background:#059669}.voice select{background:#eee;color:#000;padding:0 5px}.voice select:disabled{opacity:.55}.history{flex:1;min-height:42px;overflow-y:auto;text-align:center;padding:3px 5px;color:#d1d5db;font:12px/1.4 "Courier New",monospace}.history span{display:inline-block;margin:2px 5px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:0 0 auto}.controls button{border:0;border-radius:9px;min-height:48px;color:#fff;font-size:16px;font-weight:700;box-shadow:0 4px 10px rgba(0,0,0,.25);transition:transform .08s,filter .12s}.controls button:active,.controls button.active{transform:scale(.96);filter:brightness(.82)}.prev{background:#16a34a}.next{background:#2563eb}.auto{background:#d97706;grid-column:1/-1}.auto.running{background:#0891b2}.interval{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr 1fr;gap:6px;position:relative}.interval button{min-height:46px}.arrow{background:#eee;color:#000!important;border:0;border-radius:9px;font-size:28px;font-weight:700}.interval-display{background:#eee;color:#000!important;border:0;border-radius:9px;font-size:16px;font-weight:700}.menu{display:none;position:absolute;left:0;right:0;bottom:calc(100% + 6px);max-height:42dvh;overflow-y:auto;padding:5px;background:#1f2937;border:1px solid #4b5563;border-radius:10px;z-index:20}.menu.open{display:block}.menu button{width:100%;min-height:38px;margin:2px 0;border:0;border-radius:7px;background:#374151;color:#f9fafb;font-size:14px;font-weight:600}.menu button.selected{background:#2563eb;color:#fff}.jump{background:#7c3aed}.last{background:#db2777}.reset{background:#dc2626}.small-key{font-size:9px!important;opacity:.9}.range-active-hint{color:#93c5fd!important}@media(max-height:620px){.app{gap:4px;padding:6px}.number{font-size:clamp(48px,19vw,85px)}.range input,.range button,.voice button,.voice select{height:34px}.controls button{min-height:40px}.interval button{min-height:40px}.history{min-height:30px;font-size:10px}.position,.status{font-size:10px}}@media(max-width:340px){.range{gap:3px}.range button{padding:0 6px;font-size:11px}.range label{font-size:10px}.controls button{font-size:14px}.voice{gap:3px}.voice button,.voice select{font-size:11px}}
</style>
</head>
<body>
<main class="app">
<div id="number" class="number">0000</div>
<div id="position" class="position">1 / 10000</div>
<div class="range"><label>最小</label><input id="minInput" inputmode="numeric" maxlength="4" value="0" aria-label="最小値"><span>〜</span><label>最大</label><input id="maxInput" inputmode="numeric" maxlength="4" value="9999" aria-label="最大値"><button id="rangeButton">範囲選択</button></div>
<div id="rangeInfo" class="range-info">現在の範囲：0000 〜 9999</div>
<div id="status" class="status">自動表示停止中</div>

<div id="history" class="history"></div>
<div class="controls">
<button id="prev" class="prev">前の数字</button><button id="next" class="next">次の数字</button>
<button id="auto" class="auto">自動表示開始</button>
<div class="interval"><button id="dec" class="arrow">＜</button><button id="intervalButton" class="interval-display">3秒</button><button id="inc" class="arrow">＞</button><div id="menu" class="menu"></div></div>
<button id="first" class="jump">最初に戻る</button><button id="last" class="last">最後に進む</button><button id="reset" class="reset">リセット</button><div class="voice"><button id="voiceToggle" class="voice-toggle" type="button">🔇 音声読み上げ：OFF</button><select id="voiceSelect" aria-label="読み上げ音声"></select></div>
</div>
</main>
<script>
const INTERVALS=[['0.1秒',100],['0.2秒',200],['0.3秒',300],['0.4秒',400],['0.5秒',500],['0.6秒',600],['0.7秒',700],['0.8秒',800],['0.9秒',900],['1秒',1000],['1.1秒',1100],['1.2秒',1200],['1.3秒',1300],['1.4秒',1400],['1.5秒',1500],['1.6秒',1600],['1.7秒',1700],['1.8秒',1800],['1.9秒',1900],['2秒',2000],['2.1秒',2100],['2.2秒',2200],['2.3秒',2300],['2.4秒',2400],['2.5秒',2500],['2.6秒',2600],['2.7秒',2700],['2.8秒',2800],['2.9秒',2900],['3秒',3000],['5秒',5000],['10秒',10000],['15秒',15000],['20秒',20000],['30秒',30000],['45秒',45000],['1分',60000],['1分30秒',90000],['2分',120000],['2分30秒',150000],['3分',180000],['3分30秒',210000],['4分',240000],['4分30秒',270000],['5分',300000]];
const $=id=>document.getElementById(id),numberEl=$('number'),positionEl=$('position'),statusEl=$('status'),historyEl=$('history'),minInput=$('minInput'),maxInput=$('maxInput'),rangeInfo=$('rangeInfo'),rangeButton=$('rangeButton'),prev=$('prev'),next=$('next'),auto=$('auto'),first=$('first'),last=$('last'),reset=$('reset'),dec=$('dec'),inc=$('inc'),intervalButton=$('intervalButton'),menu=$('menu'),voiceToggle=$('voiceToggle'),voiceSelect=$('voiceSelect');
let minNumber=0,maxNumber=9999,numbers=[],index=0,running=false,timer=null,intervalIndex=29,rangeMode=0,rangeBuffer='',rangeTyping=false,voiceEnabled=false,selectedVoice=null,availableVoices=[];
function fmt(n){return String(n).padStart(4,'0')}function normalize(v){return String(v).replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-65248))}function shuffle(){numbers=Array.from({length:maxNumber-minNumber+1},(_,i)=>i+minNumber);for(let i=numbers.length-1;i>0;i--){let r=Math.floor(Math.random()*(i+1));[numbers[i],numbers[r]]=[numbers[r],numbers[i]]}index=0}
function speakNumber(){if(!voiceEnabled||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(fmt(numbers[index]).split('').join(' '));u.lang='ja-JP';if(selectedVoice)u.voice=selectedVoice;u.rate=1;u.pitch=1;window.speechSynthesis.speak(u)}
function loadVoices(){if(!('speechSynthesis'in window)){voiceSelect.disabled=true;voiceToggle.disabled=true;voiceToggle.textContent='🔇 音声非対応';return}availableVoices=window.speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('ja'));voiceSelect.innerHTML='';if(!availableVoices.length){let o=document.createElement('option');o.textContent='標準音声（ブラウザ）';voiceSelect.appendChild(o);voiceSelect.disabled=true;return}voiceSelect.disabled=false;availableVoices.forEach((v,i)=>{let o=document.createElement('option');o.value=String(i);o.textContent=v.name+'（'+v.lang+'）';voiceSelect.appendChild(o)});let saved=localStorage.getItem('randomNumberVoice');let idx=availableVoices.findIndex(v=>v.voiceURI===saved);if(idx<0)idx=0;voiceSelect.value=String(idx);selectedVoice=availableVoices[idx]}
function setVoiceEnabled(enabled){voiceEnabled=enabled;voiceToggle.textContent=enabled?'🔊 音声読み上げ：ON':'🔇 音声読み上げ：OFF';voiceToggle.classList.toggle('on',enabled);if(!enabled&&'speechSynthesis'in window)window.speechSynthesis.cancel()}
function cycleVoice(){if(!availableVoices.length||voiceSelect.disabled)return;let i=availableVoices.findIndex(v=>v.voiceURI===selectedVoice?.voiceURI);i=(i+1)%availableVoices.length;selectedVoice=availableVoices[i];voiceSelect.value=String(i);localStorage.setItem('randomNumberVoice',selectedVoice.voiceURI);if(voiceEnabled)speakNumber()}
function render(){numberEl.textContent=fmt(numbers[index]);positionEl.textContent=`${index+1} / ${numbers.length}`;historyEl.innerHTML='';for(let i=Math.max(0,index-50);i<index;i++){let s=document.createElement('span');s.textContent=fmt(numbers[i]);historyEl.appendChild(s)}historyEl.scrollTop=historyEl.scrollHeight;statusEl.textContent=running?'自動表示中':'自動表示停止中';auto.textContent=running?'自動表示停止':'自動表示開始';auto.classList.toggle('running',running);if(!rangeMode)rangeInfo.textContent=`現在の範囲：${fmt(minNumber)} 〜 ${fmt(maxNumber)}`;speakNumber()}
function flash(b){b.classList.add('active');setTimeout(()=>b.classList.remove('active'),120)}function restart(){if(!running)return;clearTimeout(timer);timer=setTimeout(autoNext,INTERVALS[intervalIndex][1])}function nextNumber(){if(index<numbers.length-1)index++;render();restart()}function prevNumber(){if(index>0)index--;render();restart()}function autoNext(){if(!running)return;if(index>=numbers.length-1){stopAuto();return}index++;render();if(index<numbers.length-1)restart();else stopAuto()}function startAuto(){if(running||index>=numbers.length-1)return;running=true;render();restart()}function stopAuto(){running=false;clearTimeout(timer);timer=null;render()}function applyRange(){let min=Number(minInput.value),max=Number(maxInput.value);if(!Number.isInteger(min)||!Number.isInteger(max)||min<0||max>9999||min>max){rangeInfo.textContent='0000〜9999の整数で、最小値≦最大値にしてください';rangeInfo.classList.add('error');return false}rangeInfo.classList.remove('error');minNumber=min;maxNumber=max;minInput.value=min;maxInput.value=max;stopAuto();shuffle();render();return true}
function setFocus(mode){minInput.classList.toggle('range-active',mode===1);maxInput.classList.toggle('range-active',mode===2);if(mode===1)minInput.focus();if(mode===2)maxInput.focus()}function cancelRange(){rangeMode=0;rangeBuffer='';rangeTyping=false;minInput.readOnly=false;maxInput.readOnly=false;minInput.classList.remove('range-active');maxInput.classList.remove('range-active');minInput.blur();maxInput.blur();render()}
function startRange(){stopAuto();rangeMode=1;rangeBuffer='';rangeTyping=false;minInput.value=minNumber;maxInput.value=maxNumber;minInput.readOnly=true;maxInput.readOnly=true;setFocus(1);rangeInfo.textContent='最小値を入力して決定 → 最大値';rangeInfo.classList.remove('error')}
function rangeKey(e){if(!rangeMode)return false;let digit=normalize(e.key);if(/^[0-9]$/.test(digit)){e.preventDefault();let input=rangeMode===1?minInput:maxInput;if(!rangeTyping){rangeBuffer='';rangeTyping=true;input.value=''}if(rangeBuffer.length<4){rangeBuffer+=digit;input.value=rangeBuffer}return true}if(e.key==='Backspace'){e.preventDefault();if(rangeTyping){rangeBuffer=rangeBuffer.slice(0,-1);(rangeMode===1?minInput:maxInput).value=rangeBuffer}return true}if(e.key==='Enter'){e.preventDefault();let input=rangeMode===1?minInput:maxInput;let value=rangeTyping?rangeBuffer:input.value;let n=Number(normalize(value));if(rangeMode===1){if(!Number.isInteger(n)||n<0||n>9999){rangeInfo.textContent='最小値は0000〜9999';rangeInfo.classList.add('error');return true}minInput.value=n;rangeMode=2;rangeBuffer='';rangeTyping=false;setFocus(2);rangeInfo.textContent='最大値を入力して決定';return true}if(!applyRange())return true;cancelRange();return true}if(e.key==='Escape'){e.preventDefault();cancelRange();return true}e.preventDefault();return true}
rangeButton.onclick=()=>{if(rangeMode)return;flash(rangeButton);startRange()};prev.onclick=()=>{if(rangeMode)return;flash(prev);prevNumber()};next.onclick=()=>{if(rangeMode)return;flash(next);nextNumber()};auto.onclick=()=>{if(rangeMode)return;flash(auto);running?stopAuto():startAuto()};first.onclick=()=>{if(rangeMode)return;flash(first);index=0;render();restart()};last.onclick=()=>{if(rangeMode)return;flash(last);index=numbers.length-1;render();stopAuto()};reset.onclick=()=>{if(rangeMode)return;flash(reset);shuffle();render()};dec.onclick=()=>{if(rangeMode)return;flash(dec);intervalIndex=Math.max(0,intervalIndex-1);updateInterval();restart()};inc.onclick=()=>{if(rangeMode)return;flash(inc);intervalIndex=Math.min(INTERVALS.length-1,intervalIndex+1);updateInterval();restart()};intervalButton.onclick=()=>{if(rangeMode)return;flash(intervalButton);menu.classList.toggle('open')};document.addEventListener('click',e=>{if(!e.target.closest('.interval'))menu.classList.remove('open')});
function updateInterval(){intervalButton.textContent=INTERVALS[intervalIndex][0];[...menu.children].forEach((b,i)=>b.classList.toggle('selected',i===intervalIndex))}INTERVALS.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x[0];b.onclick=e=>{e.stopPropagation();if(rangeMode)return;intervalIndex=i;updateInterval();restart();menu.classList.remove('open')};menu.appendChild(b)});
[minInput,maxInput].forEach(input=>input.addEventListener('input',()=>{if(!rangeMode||input.readOnly)return;let v=normalize(input.value).replace(/\D/g,'').slice(0,4);input.value=v;rangeBuffer=v;rangeTyping=true}));document.addEventListener('keydown',e=>{if(rangeMode){rangeKey(e);return}if(e.target.matches('input,select'))return;let k=e.key;if(k==='b'||k==='B'){e.preventDefault();flash(voiceToggle);setVoiceEnabled(!voiceEnabled);if(voiceEnabled)speakNumber();restart();return}if(k==='v'||k==='V'){e.preventDefault();cycleVoice();restart();return}});
voiceToggle.onclick=()=>{if(rangeMode)return;flash(voiceToggle);setVoiceEnabled(!voiceEnabled);if(voiceEnabled)speakNumber();restart()};voiceSelect.onchange=()=>{let i=Number(voiceSelect.value);selectedVoice=availableVoices[i]||null;if(selectedVoice)localStorage.setItem('randomNumberVoice',selectedVoice.voiceURI);if(voiceEnabled)speakNumber();restart()};if('speechSynthesis'in window){window.speechSynthesis.addEventListener('voiceschanged',loadVoices);loadVoices()}
shuffle();updateInterval();render();
// RANGE_BUTTON_FOCUS_FIX_V1
rangeButton.addEventListener('click',()=>{
    setTimeout(()=>{
        if(rangeMode){
            minInput.focus();
            minInput.select();
        }
    },0);
});
// RANGE_BUTTON_FOCUS_FIX_V1_END

</script>
</body>
</html>
